<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/assets/icons/logo-512.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- viewport-fit=cover + env(safe-area-inset-*) in src/pages/Home.tsx —
         needed specifically because Capacitor's native iOS WKWebView
         renders edge-to-edge (under the status bar/notch) regardless of
         this tag, unlike a plain Safari tab or an installed "Add to Home
         Screen" PWA, both of which already reserve that space on their
         own by default. Confirmed via real iPhone testing 2026-08-19:
         overlap only in the native app, not Safari or standalone PWA —
         this fix adds the missing padding without affecting the two
         contexts that were already correct. -->
    <title>i360إ</title>
    <meta
      name="description"
      content="الموسوعة الإسلامية i360إ: تطبيق عربي ينظّم مصادر إسلامية موثوقة — تطبيقات ومواقع وكتب — حسب العلوم الشرعية، في واجهة بحث عربية واحدة."
    />
    <!-- Real Lighthouse SEO finding (2026-08-25): no meta description
         existed at all. Written in Arabic, not English — this is the one
         piece of user-facing metadata a real searcher actually sees (a
         search-results snippet), consistent with the page's own lang="ar"
         and the same reasoning already applied to App Store release notes:
         Arabic for anything the app's real audience encounters directly,
         English reserved for developer/repo-facing content like
         CHANGELOG.md. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- display=block, not swap (2026-08-28) — a real, recurring bug, not
         hypothetical: the privacy dialog (first thing shown on a fresh
         install) visibly reflowed mid-view as Amiri swapped in over the
         fallback font, confirmed by real screenshots showing different
         line-wrap counts and even differently-mirrored parentheses
         between two shots seconds apart. swap paints immediately in the
         fallback, then swaps once Amiri arrives — exactly the visible
         transition causing this. Two JS-based attempts to detect and wait
         for readiness (document.fonts.ready, then explicit
         document.fonts.load() calls) both failed on real device testing —
         real, reproducible failures, not just theoretical concern. block
         moves this to the browser's own rendering pipeline instead: holds
         text invisible until Amiri is ready (or a short ~3s timeout,
         browser-dependent), rather than painting a fallback first. Only
         meaningfully costs anything on a genuinely first-ever launch with
         nothing cached — exactly the one moment this dialog appears
         anyway; every subsequent app open has the font already cached,
         so the practical downside mostly disappears where it matters. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&display=block"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
