<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="48x48" href="/assets/icons/favicon-48.png" />
    <link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0010CF" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- viewport-fit=cover + env(safe-area-inset-*) in src/pages/Home.tsx —
         needed specifically because Capacitor's native iOS WKWebView
         renders edge-to-edge (under the status bar/notch) regardless of
         this tag, unlike a plain Safari tab or an installed "Add to Home
         Screen" PWA, both of which already reserve that space on their
         own by default. Confirmed via real iPhone testing 2026-08-19:
         overlap only in the native app, not Safari or standalone PWA —
         this fix adds the missing padding without affecting the two
         contexts that were already correct. -->
    <title>i360إ</title>
    <meta
      name="description"
      content="الموسوعة الإسلامية i360إ: تطبيق عربي ينظّم مصادر إسلامية موثوقة — تطبيقات ومواقع وكتب — حسب العلوم الشرعية، في واجهة بحث عربية واحدة."
    />
    <!-- Real Lighthouse SEO finding (2026-08-25): no meta description
         existed at all. Written in Arabic, not English — this is the one
         piece of user-facing metadata a real searcher actually sees (a
         search-results snippet), consistent with the page's own lang="ar"
         and the same reasoning already applied to App Store release notes:
         Arabic for anything the app's real audience encounters directly,
         English reserved for developer/repo-facing content like
         CHANGELOG.md. -->
    <!-- The shared i360 theme: colours and Amiri (claude/i360-hub.md). A plain
         stylesheet in <head>, so it is in place before the first paint. Its
         fonts use font-display: block, not swap — swap made the first-launch
         privacy dialog reflow as Amiri arrived (§14g). The chosen theme
         (system / light / sepia / dark) is set before the first paint by
         hub/theme/early.js, built in at the end of this head section by
         vite.config.ts (§15t); the loader then keeps theme.css fresh.
         Never write a literal head or body tag inside a comment here: Vite
         and the build plugins place their scripts at the first such tag. -->
    <link rel="preconnect" href="https://theme.i36o.workers.dev" crossorigin />
    <link href="https://theme.i36o.workers.dev/theme.css" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
