    <script>// i360 theme, early part: inlined in each app's <head> (not served), after the
// app's fallback colours and before anything is drawn. It shows the saved
// theme and the saved copy of theme.css at once, so a repeat visit has no
// flash of the wrong colours. theme-loader.js does the rest.
// Plain ES5 on purpose: it must run in any browser that can show the page.
// Keep in step with CHOICE_KEY, CACHE_KEY and THEMES in site/theme-loader.js.
(function () {
  var root = document.documentElement, themes = ['system', 'light', 'sepia', 'dark'];
  var c = root.getAttribute('data-i360-lock');
  if (themes.indexOf(c) < 0) {
    try { c = localStorage.getItem('i360.theme'); } catch (e) { c = null; }
  }
  if (themes.indexOf(c) < 0) c = 'system';
  if (c === 'system') {
    c = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  }
  root.setAttribute('data-theme', c);
  try {
    var k = JSON.parse(localStorage.getItem('i360.theme.css'));
    if (k && typeof k.css === 'string') {
      var s = document.createElement('style');
      s.id = 'i360-theme';
      s.textContent = k.css;
      document.head.appendChild(s);
    }
  } catch (e) { /* no copy yet: the page's own colours */ }
})();
</script>
    <script>(function () {
'use strict';
// i360 shared theme loader — https://theme.i36o.workers.dev/theme-loader.js
//
// One module for every i360 app. In the page, in this order:
//   1. the app's built-in fallback colours (node theme/fallbacks.js --css),
//   2. theme/early.js inlined (applies the saved theme and the saved copy of
//      theme.css before anything is drawn),
//   3. this loader: either built into the page (the hub's pages: scripts/build.js
//      turns it into a plain script, window.i360Theme, so it also works offline),
//      or imported from the theme site in a module script:
//        import * as theme from 'https://theme.i36o.workers.dev/theme-loader.js';
//        theme.init();
//
// init() applies the saved choice, fetches theme.css fresh (no-cache), and
// keeps a copy on the device for the next visit and for offline use. Without
// the site and without a copy, the app's fallback stays. A page whose <html>
// has data-i360-lock="light" (the i360إ app) always shows that theme.
//
// The choices (theme, and numerals: 0123 · ٠١٢٣ · ۰۱۲۳) are shared by every app
// on the same site (hub: the landing page, Daily Reflection, the Reader, the
// CSE) and follow changes made in another tab.

const THEMES = ['system', 'light', 'sepia', 'dark'];   // the cycle order
const NUMERALS = ['western', 'arabic', 'persian'];      // 0123 · ٠١٢٣ · ۰۱۲۳ (the cycle order)
const NUMERALS_KEY = 'i360.numerals';
const CHOICE_KEY = 'i360.theme';
const CACHE_KEY = 'i360.theme.css';
const CSS_URL = new URL('theme.css', "https://theme.i36o.workers.dev/theme-loader.js").href;
const STYLE_ID = 'i360-theme';
const MAX_CSS = 256 * 1024;

const root = document.documentElement;
const darkQuery = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;
const listeners = new Set();
const numeralListeners = new Set();
let started = false;

function read(key) {
  try { return localStorage.getItem(key); } catch { return null; }
}
function write(key, value) {
  try { localStorage.setItem(key, value); return true; } catch { return false; }   // private browsing, full storage
}

function lockedTheme() {
  const t = root.getAttribute('data-i360-lock');
  return THEMES.includes(t) ? t : null;
}

/** The saved choice: system, light, sepia or dark. */
function getChoice() {
  const lock = lockedTheme();
  if (lock) return lock;
  const c = read(CHOICE_KEY);
  return THEMES.includes(c) ? c : 'system';
}

/** The palette shown now: light, sepia or dark. */
function getTheme(choice = getChoice()) {
  if (choice !== 'system') return choice;
  return darkQuery && darkQuery.matches ? 'dark' : 'light';
}

function apply() {
  const choice = getChoice();
  const theme = getTheme(choice);
  const changed = root.getAttribute('data-theme') !== theme;
  root.setAttribute('data-theme', theme);
  for (const fn of listeners) {
    try { fn({ choice, theme, changed }); } catch (e) { console.error(e); }
  }
  return { choice, theme };
}

/** Save a choice and show it. Ignored when the page is locked. */
function setChoice(choice) {
  if (!THEMES.includes(choice)) throw new Error(`Unknown theme: ${choice}`);
  if (!lockedTheme()) write(CHOICE_KEY, choice);
  return apply();
}

/** Next choice in THEMES order (for a theme button). */
function cycle() {
  const c = getChoice();
  return setChoice(THEMES[(THEMES.indexOf(c) + 1) % THEMES.length]);
}

/** Called with { choice, theme, changed } whenever the theme is applied. Returns a function that stops it. */
function onChange(fn) {
  listeners.add(fn);
  return () => listeners.delete(fn);
}

/* ---------- Numerals: the second shared choice (display only) ---------- */

const DIGIT_ZERO = { western: 0x30, arabic: 0x0660, persian: 0x06F0 };

/** The saved numerals: western (0123), arabic (٠١٢٣) or persian (۰۱۲۳, also Urdu). */
function getNumerals() {
  const n = read(NUMERALS_KEY);
  return NUMERALS.includes(n) ? n : 'western';
}

/** Every digit in text (Western, Arabic-Indic or Persian) written in the given numerals. */
function toNumerals(text, numerals = getNumerals()) {
  const zero = DIGIT_ZERO[numerals] || DIGIT_ZERO.western;
  return String(text).replace(/[0-9\u0660-\u0669\u06F0-\u06F9]/g, (d) => {
    const c = d.charCodeAt(0);
    const v = c >= 0x06F0 ? c - 0x06F0 : c >= 0x0660 ? c - 0x0660 : c - 0x30;
    return String.fromCharCode(zero + v);
  });
}

function applyNumerals() {
  const numerals = getNumerals();
  for (const fn of numeralListeners) {
    try { fn({ numerals }); } catch (e) { console.error(e); }
  }
  return { numerals };
}

/** Save the numerals choice and tell the page. */
function setNumerals(numerals) {
  if (!NUMERALS.includes(numerals)) throw new Error(`Unknown numerals: ${numerals}`);
  write(NUMERALS_KEY, numerals);
  return applyNumerals();
}

/** Next numerals in NUMERALS order (for a numerals button). */
function cycleNumerals() {
  const n = getNumerals();
  return setNumerals(NUMERALS[(NUMERALS.indexOf(n) + 1) % NUMERALS.length]);
}

/** Called with { numerals } whenever the choice changes (here or in another tab). Returns a function that stops it. */
function onNumeralsChange(fn) {
  numeralListeners.add(fn);
  return () => numeralListeners.delete(fn);
}

// Relative font addresses in theme.css point at this site, not at the page.
function absolutize(css) {
  return css.replace(/url\(\s*(['"]?)(?![a-z][a-z0-9+.-]*:|\/|#)([^'")]+)\1\s*\)/gi,
    (m, q, u) => `url(${q}${new URL(u, CSS_URL).href}${q})`);
}

function styleElement() {
  let el = document.getElementById(STYLE_ID);
  if (!el) {
    el = document.createElement('style');
    el.id = STYLE_ID;
    document.head.appendChild(el);   // after the app's fallback, so it wins
  }
  return el;
}

function cached() {
  try {
    const c = JSON.parse(read(CACHE_KEY));
    return c && c.url === CSS_URL && typeof c.css === 'string' ? c.css : null;
  } catch { return null; }
}

/**
 * Start: apply the theme, follow device and other-tab changes, refresh theme.css.
 * Resolves to { choice, theme, source } — source is "network", "cache" or "fallback".
 */
async function init() {
  const state = apply();
  if (!started) {
    started = true;
    if (darkQuery) darkQuery.addEventListener('change', () => { if (getChoice() === 'system') apply(); });
    window.addEventListener('storage', e => {
      if (e.key === CHOICE_KEY) apply();
      if (e.key === NUMERALS_KEY) applyNumerals();
    });
  }

  const copy = cached();
  const existing = document.getElementById(STYLE_ID);
  if (copy && (!existing || existing.textContent !== copy)) styleElement().textContent = copy;
  let source = copy ? 'cache' : 'fallback';

  try {
    const res = await fetch(CSS_URL, { cache: 'no-cache', mode: 'cors', credentials: 'omit' });
    if (!res.ok) throw new Error(`theme.css: HTTP ${res.status}`);
    const text = await res.text();
    if (text.length > MAX_CSS || !text.includes('--i360-bg')) throw new Error('theme.css: unexpected content');
    const css = absolutize(text);
    const el = styleElement();
    if (el.textContent !== css) el.textContent = css;
    if (css !== copy) write(CACHE_KEY, JSON.stringify({ url: CSS_URL, css }));
    source = 'network';
  } catch (e) {
    console.warn('i360 theme: using the', source === 'cache' ? 'saved copy' : "page's own colours", '—', e.message);
  }
  return { ...state, source };
}

window.i360Theme = Object.freeze({ THEMES, NUMERALS, NUMERALS_KEY, CHOICE_KEY, CACHE_KEY, CSS_URL, getChoice, getTheme, setChoice, cycle, onChange, getNumerals, toNumerals, setNumerals, cycleNumerals, onNumeralsChange, init });
})();</script>

        .text-accent { color: var(--i360-accent); }

           - Amiri has only regular (400) and bold (700): "medium" and "semibold" (500/600) would fall

<body class="min-h-screen flex flex-col items-center p-4 md:p-8">
    <header class="layout-stable flex flex-col gap-6 mb-12">
        <div class="flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="text-center md:text-start flex flex-col gap-1">
                <h1 data-i18n="title" class="text-3xl font-bold tracking-tight">Daily Reflection</h1>
                <p class="text-custom-secondary text-sm md:text-base font-medium" data-target="current-date"></p>
                <p class="text-accent text-xs md:text-sm font-bold" data-target="hijri-date"></p>
                <p class="text-custom-secondary text-[10px]" data-target="hijri-source"></p>
            </div>
            <!-- The shared numerals and theme, in the same order as in the Reader and the CSE:

                <button id="btn-numerals" type="button" class="numerals-btn glass-card px-2 py-2 rounded-xl text-custom-secondary text-xs font-bold flex items-center justify-center"></button>
                <button id="btn-theme" type="button" class="theme-btn glass-card p-2 rounded-xl text-custom-secondary flex items-center justify-center"></button>
            </div>
        </div>

        <!-- dir="rtl" keeps the language grid in a fixed order -->
        <div class="grid grid-cols-5 gap-1 glass-card p-2 rounded-2xl w-full" dir="rtl" role="group" aria-label="Language">
            <button onclick="App.setLang('ar')" id="lang-ar" class="lang-btn px-1 py-1.5 rounded-xl text-[10px] sm:text-xs font-medium text-custom-secondary">العربية</button>
            <button onclick="App.setLang('ur')" id="lang-ur" class="lang-btn px-1 py-1.5 rounded-xl text-[10px] sm:text-xs font-medium text-custom-secondary">اردو</button>
            <button onclick="App.setLang('id')" id="lang-id" class="lang-btn px-1 py-1.5 rounded-xl text-[10px] sm:text-xs font-medium text-custom-secondary">Indo</button>
            <button onclick="App.setLang('tr')" id="lang-tr" class="lang-btn px-1 py-1.5 rounded-xl text-[10px] sm:text-xs font-medium text-custom-secondary">Türkçe</button>
            <button onclick="App.setLang('en')" id="lang-en" class="lang-btn px-1 py-1.5 rounded-xl text-[10px] sm:text-xs font-medium text-custom-secondary">English</button>
        </div>
    </header>

    <main class="layout-stable space-y-8">

        <section id="hadith-card" class="glass-card rounded-3xl p-8 md:p-10 opacity-0 translate-y-4 transition-all duration-500">
            <div class="flex items-center gap-3 mb-6">
                <span class="bg-amber-100 dark:bg-amber-900/30 text-amber-600 dark:text-amber-400 p-2 rounded-lg"><i class="fas fa-book-open text-xl" aria-hidden="true"></i></span>

            const g = t => parseInt(p.find(x => x.type === t).value, 10);

                return parseInt(p.find(x => x.type === 'hour').value, 10) * 60 + parseInt(p.find(x => x.type === 'minute').value, 10);
            } catch (e) { const n = new Date(); return n.getHours() * 60 + n.getMinutes(); }
        }

            const el = document.createElement(tag);

        }

            set: (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* private mode / quota: ignore */ } }
        };

        /* ---------- Network: timeout, no retry on 4xx, bounded retries on network/5xx ---------- */
        const Net = {
            async fetch(url, { timeout = 6000, retries = 1, backoff = 800, ...opts } = {}) {
                for (let attempt = 0; ; attempt++) {
                    const ctrl = new AbortController();
                    const timer = setTimeout(() => ctrl.abort(), timeout);
                    try {
                        const r = await fetch(url, { ...opts, signal: ctrl.signal });
                        if (!r.ok) { const e = new Error('HTTP ' + r.status); e.status = r.status; throw e; }
                        return await r.json();
                    } catch (e) {
                        const permanent = e.status && e.status >= 400 && e.status < 500 && e.status !== 429;
                        if (permanent || attempt >= retries) throw e;

        const Hijri = {
            fmt: new Intl.DateTimeFormat(`en-u-ca-${CONFIG.FALLBACK_CAL}-nu-latn`, { year: 'numeric', month: 'numeric', day: 'numeric', timeZone: 'UTC' }),
            intl(dt) {                                   // dt = a calendar day as UTC midnight
                const p = this.fmt.formatToParts(dt);
                const g = t => parseInt(p.find(x => x.type === t).value, 10);
                return { y: g('year'), m: g('month'), d: g('day') };
            },
            norm: s => String(s).replace(/[\u0660-\u0669]/g, c => c.charCodeAt(0) - 0x0660)
                .replace(/[\u064B-\u0652\u0640]/g, '').replace(/[إأآٱ]/g, 'ا').replace(/ى/g, 'ي').replace(/ة/g, 'ه').replace(/\s+/g, ' ').trim(),
            MONTHS: null,
            monthMap() {
                if (this.MONTHS) return this.MONTHS;
                const list = { 'محرم': 1, 'صفر': 2, 'ربيع الأول': 3, 'ربيع الآخر': 4, 'ربيع الثاني': 4, 'جمادى الأولى': 5, 'جمادى الأول': 5,
                    'جمادى الآخرة': 6, 'جمادى الثانية': 6, 'جمادى الآخر': 6, 'رجب': 7, 'شعبان': 8, 'رمضان': 9, 'شوال': 10, 'ذو القعدة': 11, 'ذو الحجة': 12 };
                this.MONTHS = {}; Object.keys(list).forEach(k => { this.MONTHS[this.norm(k)] = list[k]; });
                return this.MONTHS;
            },
            parseDar(text) {                              // expected: "22 ربيع الأول 1448" (possibly quoted / JSON-wrapped)
                const m = this.norm(text).match(/(\d{1,2})\s+(.+?)\s+(\d{4})/);
                if (!m) return null;
                const month = this.monthMap()[this.norm(m[2])];
                const d = +m[1], y = +m[3];
                return (month && d >= 1 && d <= 30 && y >= 1400 && y <= 1600) ? { y, m: month, d } : null;
            },
            async fetchDar() {
                const key = ymdKey(tzYMD('Africa/Cairo'));  // Dar al-Ifta's date is Cairo's date
                const c = DataStore.get(CONFIG.S.J);
                if (c && c.key === key && c.h) return c.h;
                if (c && c.key === key && !c.h && Date.now() - c.ts < 3600e3) return null;   // failed recently: don't hammer
                const urls = HIJRI_PROXY ? [HIJRI_PROXY] : CONFIG.API.DI;
                for (const url of urls) {
                    const ctrl = new AbortController(); const timer = setTimeout(() => ctrl.abort(), HIJRI_PROXY ? 12000 : 5000);
                    try {
                        const r = await fetch(url, { signal: ctrl.signal, cache: 'no-store' });
                        if (!r.ok) continue;
                        const body = await r.text();
                        let text = body;
                        if (HIJRI_PROXY) {                      // the Worker answers {hijri, cairo}; a different Cairo date means the answer is stale
                            const j = JSON.parse(body);
                            if (j.cairo !== key) { console.warn('Dar al-Ifta proxy answered for', j.cairo, 'but Cairo is on', key); continue; }
                            text = j.hijri;
                        }
                        const h = this.parseDar(text);
                        if (h) { DataStore.set(CONFIG.S.J, { key, h, ts: Date.now() }); return h; }
                    } catch (e) { /* mixed content, CORS, network, timeout, bad JSON: try next */ }
                    finally { clearTimeout(timer); }
                }
                DataStore.set(CONFIG.S.J, { key, h: null, ts: Date.now() });
                return null;
            },

            sync() { const base = civil(localYMD()); return { k: 0, source: 'intl', base, today: this.intl(base) }; },
            async resolve() {
                const base = civil(localYMD()), cairo = civil(tzYMD('Africa/Cairo'));
                const dar = await this.fetchDar();

                    for (const kk of [0, -1, 1, -2, 2]) {
                        const h = this.intl(addDays(cairo, kk));
                        if (h.y === dar.y && h.m === dar.m && h.d === dar.d) { k = kk; source = 'dar'; break; }
                    }
                    if (source !== 'dar') console.warn('Dar al-Ifta date is more than 2 days from the Intl calendar; ignored.', dar);
                }
                return { k, source, base, today: this.intl(addDays(base, k)) };
            },
            /* Next occurrence of every event, by walking forward day by day (no drifting arithmetic). */
            events(h) {

                    const x = addDays(h.base, i), hh = this.intl(addDays(x, h.k));

                        if (!seen.has(e.id) && e.m + 1 === hh.m && e.d === hh.d) { seen.add(e.id); out.push({ id: e.id, d: e.d, m: e.m, year: hh.y, date: x, isT: i === 0 }); }
                    }
                }
                return out.slice(0, 10);
            }
        };

        /* ---------- HadeethEnc (IslamHouse / Saudi Ministry of Islamic Affairs) ---------- */
        const HE = {
            per: 20,
            async list(lang, cat, page) {
                const r = await Net.fetch(`${CONFIG.API.HE}/hadeeths/list/?language=${lang}&category_id=${cat}&page=${page}&per_page=${this.per}`);
                const m = r.meta || {};
                return { items: Array.isArray(r) ? r : (r.data || []), total: Number(m.total_items ?? m.total ?? m.count) || 0, lastPage: Number(m.last_page) || 0 };
            },
            async pickId(lang) {
                const r = await Net.fetch(`${CONFIG.API.HE}/categories/roots/?language=${lang}`);
                const roots = (Array.isArray(r) ? r : (r.data || [])).filter(c => !CONFIG.HADEETH_EXCLUDE_ROOTS.includes(String(c.id)));
                if (!roots.length) throw new Error('HadeethEnc: no root categories');
                const counts = roots.map(c => Number(c.hadeeths_count) || 0), total = counts.reduce((a, b) => a + b, 0);
                let root, idx = null;
                if (total > 0) {                           // uniform over all hadiths in the allowed roots
                    let n = Math.floor(Math.random() * total);
                    for (let i = 0; i < roots.length; i++) { if (n < counts[i]) { root = roots[i]; idx = n; break; } n -= counts[i]; }
                } else root = roots[Math.floor(Math.random() * roots.length)];
                let res;
                try { res = await this.list(lang, root.id, idx === null ? 1 : Math.floor(idx / this.per) + 1); }
                catch (e) { if (e.status && e.status < 500) { idx = null; res = await this.list(lang, root.id, 1); } else throw e; }
                if (idx === null) {                        // sizes unknown: learn them from meta, then jump to a random page
                    const last = res.lastPage || (res.total ? Math.ceil(res.total / this.per) : 1);
                    const p = 1 + Math.floor(Math.random() * last);
                    if (p !== 1) res = await this.list(lang, root.id, p);
                    idx = Math.floor(Math.random() * Math.max(res.items.length, 1));
                }
                if (!res.items.length) throw new Error('HadeethEnc: empty page');
                return String(res.items[Math.min(idx % this.per, res.items.length - 1)].id);
            },
            one(lang, id, opts) { return Net.fetch(`${CONFIG.API.HE}/hadeeths/one/?id=${id}&language=${lang}`, opts); },
            async daily(lang) {
                const day = ymdKey(localYMD()), c = DataStore.get(CONFIG.S.H);
                let id = (c && c.day === day && c.lang === lang) ? c.id : null;
                for (let attempt = 0; attempt < 2; attempt++) {

                        // Arabic record in the background, so a slow or failed extra request never delays or blocks the hadith itself.
                        if (lang !== 'ar' && !rec.reference) {
                            this.one('ar', id, { retries: 0, timeout: 4000 }).then(ar => {
                                if (ar && ar.reference) { rec.reference = ar.reference; if (App.state.hadith === rec) UI.renderHadith(); }
                            }).catch(() => { /* bibliography is optional */ });
                        }
                        return rec;
                    }
                    catch (e) { if (attempt === 0 && e.status && e.status < 500) { id = null; continue; } throw e; }   // stale/missing id: pick again once
                }
            }
        };

        const SCHOOL_PARAM = [0, 1];   // AlAdhan: 0 = Shafi/standard, 1 = Hanafi

        /* ---------- Numerals: every number on the page in the shared choice (display only) ---------- */
        const Numerals = {
            fix(node) {
                const v = node.nodeValue;
                if (!/[0-9\u0660-\u0669\u06F0-\u06F9]/.test(v)) return;
                const nv = i360Theme.toNumerals(v);
                if (nv !== v) node.nodeValue = nv;
            },
            walk(root) {
                if (root.nodeType === 3) { this.fix(root); return; }
                if (root.nodeType !== 1 || root.closest('script, style, #btn-numerals')) return;
                const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, { acceptNode: (n) => (n.parentElement && n.parentElement.closest('script, style, #btn-numerals')) ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT });
                for (let n = w.nextNode(); n; n = w.nextNode()) this.fix(n);
            },
            all() { this.walk(document.body); },
            // Text the page draws later (prayer times, countdowns, dates…) is converted as it appears.
            watch() {
                new MutationObserver((list) => {
                    for (const m of list) {
                        if (m.type === 'characterData') this.fix(m.target);
                        else m.addedNodes.forEach((n) => this.walk(n));
                    }
                }).observe(document.body, { childList: true, characterData: true, subtree: true });
                this.all();
            }
        };

        const App = {

            get school() { return DataStore.get(CONFIG.S.M, 0) === 1 ? 1 : 0; },
            setLang(l) {
                DataStore.set(CONFIG.S.L, l);
                this.state.quran = null; this.state.hadith = null; this.state.err.quran = null; this.state.err.hadith = null;
                UI.render();                                        // labels, dates and methods re-render from state
                ['quran', 'hadith', 'geo'].forEach(n => this.run(n)); // only the language-dependent requests are repeated
            },
            setSchool(s) { DataStore.set(CONFIG.S.M, s); UI.renderSchool(); this.run('prayer'); },
            getPosition() {
                if (this._pos) return this._pos;
                const DAY_MS = 864e5, c = DataStore.get(CONFIG.S.C);
                const fresh = c && c.ts && Date.now() - c.ts < DAY_MS;
                this._pos = new Promise(res => {
                    if (fresh || !navigator.geolocation) return res(c ? { lat: c.lat, lng: c.lng } : { lat: 30.01, lng: 31.20 });
                    navigator.geolocation.getCurrentPosition(
                        p => { const pos = { lat: p.coords.latitude, lng: p.coords.longitude }; DataStore.set(CONFIG.S.C, { ...pos, ts: Date.now() }); res(pos); },
                        () => res(c ? { lat: c.lat, lng: c.lng } : { lat: 30.01, lng: 31.20 }),   // stale cache beats the Giza default
                        { timeout: 5000, maximumAge: 3600e3 });
                });
                return this._pos;
            },
            loaders: {
                async quran(lang) {
                    const day = ymdKey(localYMD());
                    let rec = DataStore.get(CONFIG.S.Q);
                    if (!rec || rec.day !== day) { rec = { day, id: Math.floor(Math.random() * 6236) + 1 }; DataStore.set(CONFIG.S.Q, rec); }
                    return Net.fetch(`${CONFIG.API.Q}/${rec.id}/editions/quran-uthmani,${CONFIG.EDITIONS.quran[lang]}`);
                },
                hadith: lang => HE.daily(lang),
                async prayer() {
                    const pos = await App.getPosition(), n = localYMD();
                    const r = await Net.fetch(`${CONFIG.API.P}/${pad(n.d)}-${pad(n.m)}-${n.y}?latitude=${pos.lat}&longitude=${pos.lng}&school=${SCHOOL_PARAM[App.school]}`);
                    if (!r.data || !r.data.timings) throw new Error('AlAdhan: unexpected response');
                    return r;
                },
                async geo(lang) {
                    const pos = await App.getPosition();
                    return Net.fetch(`${CONFIG.API.G}?latitude=${pos.lat}&longitude=${pos.lng}&localityLanguage=${lang}`);
                }
            },
            async run(name) {
                const id = this.tokens[name] = (this.tokens[name] || 0) + 1;     // drop answers that arrive after a newer request
                if (name !== 'geo') UI.status(name, 'loading');
                try {
                    const data = await this.loaders[name](this.lang);
                    if (this.tokens[name] !== id) return;
                    this.state[name] = data; this.state.err[name] = null;

                    if (this.tokens[name] !== id) return;
                    console.error(`[${name}]`, e);
                    this.state[name] = (name === 'prayer') ? this.state[name] : null;   // keep old prayer times if a refresh fails
                    this.state.err[name] = e;

            },
            load() {

            retry(name) { this.run(name); },

                document.addEventListener('visibilitychange', () => { if (!document.hidden) App.tick(); });
            },
            numeralsButton() {   // label and tooltip for the shared numerals choice, in the page's language
                const n = i360Theme.getNumerals(), L = LOCALES[App.lang] || LOCALES.ar, btn = document.getElementById('btn-numerals');
                const key = { western: 'numeralsWestern', arabic: 'numeralsArabic', persian: 'numeralsPersian' }[n];
                btn.textContent = NUMERALS_LABEL[n];
                btn.title = L[key] || THEME_TITLES.en[key];
                btn.setAttribute('aria-label', btn.title);
            },
            theme() {   // the theme button: icon and tooltip for the shared choice, in the page's language
                const c = i360Theme.getChoice(), L = LOCALES[App.lang] || LOCALES.ar, btn = document.getElementById('btn-theme');
                const T = { system: L.themeSystem, light: L.themeLight, sepia: L.themeSepia, dark: L.themeDark };
                btn.innerHTML = THEME_ICON[c];
                btn.title = T[c] || THEME_TITLES.en[{ system: 'themeSystem', light: 'themeLight', sepia: 'themeSepia', dark: 'themeDark' }[c]];
                btn.setAttribute('aria-label', btn.title);
            },
            set(t, v) { if (this.targets[t]) this.targets[t].textContent = v; },
            status(name, kind) {
                const box = document.querySelector(`[data-status="${name}"]`); if (!box) return;
                const L = this.L, btn = box.querySelector('[data-retry]'), txt = box.querySelector('[data-status-text]');
                if (!kind) { box.classList.add('hidden'); box.classList.remove('flex'); return; }
                box.classList.remove('hidden'); box.classList.add('flex');
                txt.textContent = kind === 'loading' ? L.loading : L.loadError;
                btn.textContent = L.retry; btn.classList.toggle('hidden', kind === 'loading');
            },
            reveal() {
                if (this.shown) return; this.shown = true;
                ['quran-card', 'hadith-card', 'prayer-card', 'events-card'].forEach((id, i) => setTimeout(() => {
                    const e = document.getElementById(id); if (e) { e.style.opacity = 1; e.style.transform = 'translateY(0)'; }
                }, i * 120));
            },
            render() {
                const L = this.L, lang = App.lang;
                document.documentElement.lang = lang; document.documentElement.dir = L.dir;
                document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = L[el.dataset.i18n] || LOCALES.en[el.dataset.i18n]; });
                document.querySelectorAll('[id^="lang-"]').forEach(el => { const on = el.id === `lang-${lang}`; el.classList.toggle('active-btn', on); el.setAttribute('aria-pressed', on); });
                this.theme();            // their tooltips are in the page's language
                this.numeralsButton();
                document.title = L.title;   // the tab name follows the language too
                this.renderSchool();
                this.renderHijri();
                ['quran', 'hadith', 'prayer', 'geo'].forEach(n => this.renderPart(n));
                this.renderEvents();
                this.reveal();
            },
            renderSchool() {
                [0, 1].forEach(s => { const b = document.getElementById(`school-${s}`); if (!b) return; const on = App.school === s; b.classList.toggle('active-btn', on); b.setAttribute('aria-pressed', on); });
            },
            renderHijri() {
                const L = this.L, h = App.state.hijri; if (!h) return;
                this.set('current-date', new Date().toLocaleDateString(App.lang, { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' }));
                this.set('hijri-date', `${h.today.d} ${L.months[h.today.m - 1]} ${h.today.y}`);
                this.set('hijri-source', h.source === 'dar' ? L.darLabel : L.calcLabel);
            },
            renderPart(name) {
                const fn = { quran: 'renderQuran', hadith: 'renderHadith', prayer: 'renderPrayers', geo: 'renderPrayers' }[name];
                this[fn]();
                if (name !== 'geo') this.status(name, App.state.err[name] ? 'error' : (App.state[name] ? null : (App.tokens[name] ? 'loading' : null)));
            },
            renderQuran() {
                const q = App.state.quran, lang = App.lang;
                if (!q) { ['quran-arabic', 'quran-translation', 'quran-ref'].forEach(t => this.set(t, '')); return; }
                this.set('quran-arabic', q.data[0].text);
                this.set('quran-translation', q.data[1].text);
                this.set('quran-ref', `${(lang === 'ar' || lang === 'ur') ? q.data[0].surah.name : q.data[0].surah.englishName} (${q.data[0].surah.number}:${q.data[0].numberInSurah})`);
            },
            renderHadith() {
                const h = App.state.hadith, L = this.L, lang = App.lang;
                const hide = (el, on) => { if (el) el.classList.toggle('hidden', on); };
                if (!h) {
                    ['hadith-title', 'hadith-narrator', 'hadith-text', 'hadith-grade', 'hadith-ref'].forEach(t => this.set(t, ''));
                    hide(this.targets['hadith-narrator'], true); hide(document.getElementById('hadith-refs'), true); return;
                }
                this.set('hadith-title', h.title || '');
                /* HadeethEnc returns the opening line naming the Companion (the highest narrator) as `hadeeth_intro`.
                   It is shown on its own line; every character of the text is still displayed (its terms forbid deleting any).
                   If the field is missing, or the text doesn't begin with it, the whole text is shown as one block. */
                const full = h.hadeeth || '', intro = (h.hadeeth_intro || '').trim();
                let narrator = '', body = full;
                if (intro && full.trimStart().startsWith(intro)) {
                    const rest = full.trimStart().slice(intro.length).trim();
                    if (rest) { narrator = intro; body = rest; }
                }
                this.set('hadith-narrator', narrator); hide(this.targets['hadith-narrator'], !narrator);
                this.set('hadith-text', body);
                this.set('hadith-grade', [h.grade ? `${L.gradeLabel}: ${h.grade}` : '', h.attribution || ''].filter(Boolean).join(' · '));
                /* `reference` is HadeethEnc's bibliography (editions used), Arabic only. Kept in full, collapsed by default. */
                const refs = (h.reference || '').trim();
                this.set('hadith-ref', refs); hide(document.getElementById('hadith-refs'), !refs);
                const a = this.targets['hadith-link']; if (a) a.href = `https://hadeethenc.com/${lang}/browse/hadith/${encodeURIComponent(h.id)}`;
            },
            renderPrayers() {
                const L = this.L, p = App.state.prayer, g = App.state.geo, lang = App.lang;
                const loc = g ? [g.city || g.locality, g.countryName].filter(Boolean).join(', ') : '';
                this.set('meta-location', loc || '—');
                const grid = this.targets['prayer-grid'];
                if (!p) { grid.replaceChildren(); this.set('meta-method', '—'); this.set('meta-timezone', '—'); return; }
                const t = p.data.timings, meta = p.data.meta || {}, tz = meta.timezone;
                const toMin = k => { const m = /(\d{1,2}):(\d{2})/.exec(t[k] || ''); return m ? (+m[1]) * 60 + (+m[2]) : null; };
                const now = minutesNowIn(tz);
                let next = CONFIG.P_NEXT_KEYS.find(k => toMin(k) !== null && toMin(k) > now);
                if (!next) next = 'Fajr';                                 // after Isha the next prayer is tomorrow's Fajr
                grid.replaceChildren(...CONFIG.P_KEYS.map((k, i) => {
                    const isNext = k === next, m = /(\d{1,2}):(\d{2})/.exec(t[k] || '');
                    const box = mk('div', `flex flex-col items-center p-3 transition-all ${isNext ? 'next-prayer-highlight' : 'inset-item'}`);
                    box.append(
                        mk('span', `text-[10px] md:text-xs font-bold ${isNext ? 'text-accent' : 'text-custom-secondary'}`, L.prayers[i]),
                        mk('span', `text-base md:text-xl font-bold mt-1 ${isNext ? 'text-accent' : 'text-custom-secondary'}`, m ? m[0] : '—'));
                    if (isNext) box.append(mk('span', 'text-[8px] mt-1 font-black text-accent animate-pulse', L.next));
                    return box;
                }));
                const mid = meta.method && meta.method.id;
                this.set('meta-method', (lang === 'ar' && METHOD_AR[mid]) || (meta.method && meta.method.name) || '—');
                let tzText = tz || '—';
                try { const n = new Intl.DateTimeFormat(lang, { timeZone: tz, timeZoneName: 'long' }).formatToParts(new Date()).find(x => x.type === 'timeZoneName'); if (n) tzText = n.value; } catch (e) { /* localized name only; the raw IANA id stays as the fallback */ }
                this.set('meta-timezone', tzText);
            },
            renderEvents() {
                const L = this.L, lang = App.lang, h = App.state.hijri, list = this.targets['events-list'];
                if (!h || !list) return;
                list.replaceChildren(...Hijri.events(h).map(e => {
                    const row = mk('div', `flex justify-between items-center p-4 transition-all ${e.isT ? 'border-2 border-purple-500 bg-purple-50 dark:bg-purple-900/10 rounded-2xl' : 'inset-item'}`);
                    const left = mk('div', 'flex-1'), title = mk('div', 'flex items-center gap-2');
                    title.append(mk('span', 'text-sm font-bold text-custom-secondary', L.events[e.id]));
                    if (e.isT) title.append(mk('span', 'bg-purple-500 text-white text-[8px] font-black px-1.5 py-0.5 rounded-full', L.todayLabel));
                    left.append(title, mk('span', 'text-xs text-custom-secondary font-medium', `${e.d} ${L.months[e.m]} ${e.year}`));
                    const right = mk('div', 'text-start md:text-end ms-4');
                    right.append(
                        mk('span', 'text-[10px] uppercase font-bold text-purple-600 block', L.expected),
                        mk('span', 'text-xs font-medium text-custom-secondary', e.date.toLocaleDateString(lang, { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric', timeZone: 'UTC' })));
                    row.append(left, right);
                    return row;
                }));
            }
        };
        document.addEventListener('DOMContentLoaded', () => { UI.init(); });

    </script>
</body>
