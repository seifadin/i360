  <script>// i360 theme, early part: inlined in each app's <head> (not served), after the
// app's fallback colours and before anything is drawn. It shows the saved
// theme and the saved copy of theme.css at once, so a repeat visit has no
// flash of the wrong colours. theme-loader.js does the rest.
// Plain ES5 on purpose: it must run in any browser that can show the page.
// Keep in step with CHOICE_KEY, CACHE_KEY and THEMES in site/theme-loader.js.
(function () {
  var root = document.documentElement, themes = ['system', 'light', 'sepia', 'dark'];
  var c = root.getAttribute('data-i360-lock');
  if (themes.indexOf(c) < 0) {
    try { c = localStorage.getItem('i360.theme'); } catch (e) { c = null; }
  }
  if (themes.indexOf(c) < 0) c = 'system';
  if (c === 'system') {
    c = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  }
  root.setAttribute('data-theme', c);
  try {
    var k = JSON.parse(localStorage.getItem('i360.theme.css'));
    if (k && typeof k.css === 'string') {
      var s = document.createElement('style');
      s.id = 'i360-theme';
      s.textContent = k.css;
      document.head.appendChild(s);
    }
  } catch (e) { /* no copy yet: the page's own colours */ }
})();
</script>
  <script>(function () {
'use strict';
// i360 shared theme loader — https://theme.i36o.workers.dev/theme-loader.js
//
// One module for every i360 app. In the page, in this order:
//   1. the app's built-in fallback colours (node theme/fallbacks.js --css),
//   2. theme/early.js inlined (applies the saved theme and the saved copy of
//      theme.css before anything is drawn),
//   3. this loader: either built into the page (the hub's pages: scripts/build.js
//      turns it into a plain script, window.i360Theme, so it also works offline),
//      or imported from the theme site in a module script:
//        import * as theme from 'https://theme.i36o.workers.dev/theme-loader.js';
//        theme.init();
//
// init() applies the saved choice, fetches theme.css fresh (no-cache), and
// keeps a copy on the device for the next visit and for offline use. Without
// the site and without a copy, the app's fallback stays. A page whose <html>
// has data-i360-lock="light" (the i360إ app) always shows that theme.
//
// The choices (theme, and numerals: 0123 · ٠١٢٣ · ۰۱۲۳) are shared by every app
// on the same site (hub: the landing page, Daily Reflection, the Reader, the
// CSE) and follow changes made in another tab.

const THEMES = ['system', 'light', 'sepia', 'dark'];   // the cycle order
const NUMERALS = ['western', 'arabic', 'persian'];      // 0123 · ٠١٢٣ · ۰۱۲۳ (the cycle order)
const NUMERALS_KEY = 'i360.numerals';
const CHOICE_KEY = 'i360.theme';
const CACHE_KEY = 'i360.theme.css';
const CSS_URL = new URL('theme.css', "https://theme.i36o.workers.dev/theme-loader.js").href;
const STYLE_ID = 'i360-theme';
const MAX_CSS = 256 * 1024;

const root = document.documentElement;
const darkQuery = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;
const listeners = new Set();
const numeralListeners = new Set();
let started = false;

function read(key) {
  try { return localStorage.getItem(key); } catch { return null; }
}
function write(key, value) {
  try { localStorage.setItem(key, value); return true; } catch { return false; }   // private browsing, full storage
}

function lockedTheme() {
  const t = root.getAttribute('data-i360-lock');
  return THEMES.includes(t) ? t : null;
}

/** The saved choice: system, light, sepia or dark. */
function getChoice() {
  const lock = lockedTheme();
  if (lock) return lock;
  const c = read(CHOICE_KEY);
  return THEMES.includes(c) ? c : 'system';
}

/** The palette shown now: light, sepia or dark. */
function getTheme(choice = getChoice()) {
  if (choice !== 'system') return choice;
  return darkQuery && darkQuery.matches ? 'dark' : 'light';
}

function apply() {
  const choice = getChoice();
  const theme = getTheme(choice);
  const changed = root.getAttribute('data-theme') !== theme;
  root.setAttribute('data-theme', theme);
  for (const fn of listeners) {
    try { fn({ choice, theme, changed }); } catch (e) { console.error(e); }
  }
  return { choice, theme };
}

/** Save a choice and show it. Ignored when the page is locked. */
function setChoice(choice) {
  if (!THEMES.includes(choice)) throw new Error(`Unknown theme: ${choice}`);
  if (!lockedTheme()) write(CHOICE_KEY, choice);
  return apply();
}

/** Next choice in THEMES order (for a theme button). */
function cycle() {
  const c = getChoice();
  return setChoice(THEMES[(THEMES.indexOf(c) + 1) % THEMES.length]);
}

/** Called with { choice, theme, changed } whenever the theme is applied. Returns a function that stops it. */
function onChange(fn) {
  listeners.add(fn);
  return () => listeners.delete(fn);
}

/* ---------- Numerals: the second shared choice (display only) ---------- */

const DIGIT_ZERO = { western: 0x30, arabic: 0x0660, persian: 0x06F0 };

/** The saved numerals: western (0123), arabic (٠١٢٣) or persian (۰۱۲۳, also Urdu). */
function getNumerals() {
  const n = read(NUMERALS_KEY);
  return NUMERALS.includes(n) ? n : 'western';
}

/** Every digit in text (Western, Arabic-Indic or Persian) written in the given numerals. */
function toNumerals(text, numerals = getNumerals()) {
  const zero = DIGIT_ZERO[numerals] || DIGIT_ZERO.western;
  return String(text).replace(/[0-9\u0660-\u0669\u06F0-\u06F9]/g, (d) => {
    const c = d.charCodeAt(0);
    const v = c >= 0x06F0 ? c - 0x06F0 : c >= 0x0660 ? c - 0x0660 : c - 0x30;
    return String.fromCharCode(zero + v);
  });
}

function applyNumerals() {
  const numerals = getNumerals();
  for (const fn of numeralListeners) {
    try { fn({ numerals }); } catch (e) { console.error(e); }
  }
  return { numerals };
}

/** Save the numerals choice and tell the page. */
function setNumerals(numerals) {
  if (!NUMERALS.includes(numerals)) throw new Error(`Unknown numerals: ${numerals}`);
  write(NUMERALS_KEY, numerals);
  return applyNumerals();
}

/** Next numerals in NUMERALS order (for a numerals button). */
function cycleNumerals() {
  const n = getNumerals();
  return setNumerals(NUMERALS[(NUMERALS.indexOf(n) + 1) % NUMERALS.length]);
}

/** Called with { numerals } whenever the choice changes (here or in another tab). Returns a function that stops it. */
function onNumeralsChange(fn) {
  numeralListeners.add(fn);
  return () => numeralListeners.delete(fn);
}

// Relative font addresses in theme.css point at this site, not at the page.
function absolutize(css) {
  return css.replace(/url\(\s*(['"]?)(?![a-z][a-z0-9+.-]*:|\/|#)([^'")]+)\1\s*\)/gi,
    (m, q, u) => `url(${q}${new URL(u, CSS_URL).href}${q})`);
}

function styleElement() {
  let el = document.getElementById(STYLE_ID);
  if (!el) {
    el = document.createElement('style');
    el.id = STYLE_ID;
    document.head.appendChild(el);   // after the app's fallback, so it wins
  }
  return el;
}

function cached() {
  try {
    const c = JSON.parse(read(CACHE_KEY));
    return c && c.url === CSS_URL && typeof c.css === 'string' ? c.css : null;
  } catch { return null; }
}

/**
 * Start: apply the theme, follow device and other-tab changes, refresh theme.css.
 * Resolves to { choice, theme, source } — source is "network", "cache" or "fallback".
 */
async function init() {
  const state = apply();
  if (!started) {
    started = true;
    if (darkQuery) darkQuery.addEventListener('change', () => { if (getChoice() === 'system') apply(); });
    window.addEventListener('storage', e => {
      if (e.key === CHOICE_KEY) apply();
      if (e.key === NUMERALS_KEY) applyNumerals();
    });
  }

  const copy = cached();
  const existing = document.getElementById(STYLE_ID);
  if (copy && (!existing || existing.textContent !== copy)) styleElement().textContent = copy;
  let source = copy ? 'cache' : 'fallback';

  try {
    const res = await fetch(CSS_URL, { cache: 'no-cache', mode: 'cors', credentials: 'omit' });
    if (!res.ok) throw new Error(`theme.css: HTTP ${res.status}`);
    const text = await res.text();
    if (text.length > MAX_CSS || !text.includes('--i360-bg')) throw new Error('theme.css: unexpected content');
    const css = absolutize(text);
    const el = styleElement();
    if (el.textContent !== css) el.textContent = css;
    if (css !== copy) write(CACHE_KEY, JSON.stringify({ url: CSS_URL, css }));
    source = 'network';
  } catch (e) {
    console.warn('i360 theme: using the', source === 'cache' ? 'saved copy' : "page's own colours", '—', e.message);
  }
  return { ...state, source };
}

window.i360Theme = Object.freeze({ THEMES, NUMERALS, NUMERALS_KEY, CHOICE_KEY, CACHE_KEY, CSS_URL, getChoice, getTheme, setChoice, cycle, onChange, getNumerals, toNumerals, setNumerals, cycleNumerals, onNumeralsChange, init });
})();</script>

  <style>

    /* The numerals and theme buttons: same look and order as in the Reader and the

      display: flex; gap: 0.25rem;

    .theme-btn:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--i360-focus); }
    .numerals-btn { font-family: inherit; font-weight: 700; font-size: 0.82rem; min-width: 2.4rem; font-variant-numeric: tabular-nums; }
    .theme-btn svg {
      width: 1.15rem; height: 1.15rem;

  <script>
    // The theme button: shows the shared choice and moves to the next one.
    (function () {
      var ICON = {
        system: '<svg viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="14" rx="2"></rect><path d="M8 21h8"></path><path d="M12 17v4"></path></svg>',

        dark: '<svg viewBox="0 0 24 24"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"></path></svg>'
      };
      var TITLE = {
        system: 'المظهر: حسب الجهاز (انقر للتبديل إلى فاتح)',
        light: 'المظهر: فاتح (انقر للتبديل إلى ورقي)',
        sepia: 'المظهر: ورقي (انقر للتبديل إلى داكن)',
        dark: 'المظهر: داكن (انقر للتبديل إلى حسب الجهاز)'
      };
      var btn = document.getElementById('btn-theme');
      function show(choice) {
        btn.innerHTML = ICON[choice];
        btn.title = TITLE[choice];
        btn.setAttribute('aria-label', TITLE[choice]);
      }
      i360Theme.onChange(function (s) { show(s.choice); });
      btn.addEventListener('click', function () { i360Theme.cycle(); });
      show(i360Theme.getChoice());

      // The numerals button: the shared choice (0123 · ٠١٢٣ · ۰۱۲۳); here it only
      // changes the digits of the name.
      var nbtn = document.getElementById('btn-numerals'), name = document.getElementById('name');
      var LABEL = { western: '456', arabic: '٤٥٦', persian: '۴۵۶' };   // 4–6 differ between ٠١٢٣ and ۰۱۲۳
      var NTITLE = {
        western: 'الأرقام: غربية 456 (انقر للتبديل إلى العربية المشرقية ٤٥٦)',
        arabic: 'الأرقام: عربية مشرقية ٤٥٦ (انقر للتبديل إلى الفارسية/الأردية ۴۵۶)',
        persian: 'الأرقام: فارسية/أردية ۴۵۶ (انقر للتبديل إلى الغربية 456)'
      };
      function showNumerals(n) {
        nbtn.textContent = LABEL[n];
        nbtn.title = NTITLE[n];
        nbtn.setAttribute('aria-label', NTITLE[n]);
        name.textContent = i360Theme.toNumerals(name.textContent, n);
      }
      i360Theme.onNumeralsChange(function (s) { showNumerals(s.numerals); });
      nbtn.addEventListener('click', function () { i360Theme.cycleNumerals(); });
      showNumerals(i360Theme.getNumerals());
      i360Theme.init();
    })();
  </script>
