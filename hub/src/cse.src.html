<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <!--@@CSP@@-->
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>البحث في &#x2066;i360إ&#x2069;</title>
  <meta name="description" content="ابحث في نصوص الكتب والمقالات المرتبطة بالموسوعة الإسلامية i360إ، مرتبةً حسب العلوم الشرعية.">

  <!-- Shared i360 theme (theme/ in this repo; https://theme.i36o.workers.dev):
       1. built-in colours, used until theme.css arrives and when it can't;
       2. the saved theme and the saved copy of theme.css, before anything is drawn;
       3. the loader (bundled into the page's script, so the theme button also works offline). -->
  <style id="i360-fallback">/*@@THEME_FALLBACK@@*/</style>
  <script>/*@@THEME_EARLY@@*/</script>
  <link rel="preconnect" href="/*@@THEME_ORIGIN@@*/" crossorigin>

  <style>
    /* Colours: the shared theme's own variables (--i360-…, hub/theme/site/theme.css), used directly;
       the theme is <html data-theme="…">. */
    :root { --page-w: 50rem; --gap: clamp(0.75rem, 2vw, 1.5rem); }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    [hidden] { display: none !important; }

    body {
      font-family: var(--i360-font);   /* Amiri, from the shared theme */
      font-size: 1.05rem;
      background-color: var(--i360-bg);
      color: var(--i360-text);
      line-height: 1.6;
      /* The page scrolls inside .scroller, not the window: browsers keep the
         window's scrollbar on the right even in Arabic, but put a
         right-to-left element's scrollbar on the left. */
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .scroller { flex: 1; min-height: 0; overflow-y: auto; direction: rtl; overscroll-behavior: contain; }
    .scroller:focus { outline: none; }

    /* ---------- Toolbar ---------- */
    /*@@PAGE_CHROME@@*/
    /* The bar and everything in it: src/page-chrome.css. Here: its place in the page. */
    .toolbar { flex-shrink: 0; z-index: 10; }

    /* ---------- Search ---------- */
    main { width: var(--page-w); max-width: 100%; margin: 0 auto; padding: var(--gap) 1rem calc(var(--gap) + env(safe-area-inset-bottom)); }

    .search-form { display: flex; gap: 0.5rem; }
    .search-input {
      flex: 1;
      min-width: 0;
      height: 2.75rem;
      padding: 0 0.85rem;
      border: 1px solid var(--i360-border);
      border-radius: 0.5rem;
      background: var(--i360-input);
      color: var(--i360-text);
      font-family: inherit;
      font-size: 1.15rem;
      outline: none;
    }
    .search-input:focus { border-color: var(--i360-focus); box-shadow: 0 0 0 3px color-mix(in srgb, var(--i360-focus) 25%, transparent); }
    .search-btn {
      height: 2.75rem;
      padding: 0 1.1rem;
      border: none;
      border-radius: 0.5rem;
      background: var(--i360-accent);
      color: var(--i360-on-accent);
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
    }
    .search-btn:focus-visible { outline: none; box-shadow: 0 0 0 3px color-mix(in srgb, var(--i360-focus) 40%, transparent); }

    .options { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 0.6rem; }
    .chip {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      height: 2rem;
      padding: 0 0.75rem;
      border: 1px solid var(--i360-border);
      border-radius: 999px;
      background: var(--i360-surface);
      color: var(--i360-text);
      font-family: inherit;
      font-size: 0.85rem;
      cursor: pointer;
    }
    .chip[aria-pressed="true"] { background: var(--i360-active); border-color: var(--i360-focus); color: var(--i360-heading); font-weight: 700; }
    .chip:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--i360-focus); }
    .chip-box { width: 0.9rem; height: 0.9rem; border: 1.5px solid currentColor; border-radius: 0.2rem; display: inline-flex; align-items: center; justify-content: center; font-size: 0.7rem; line-height: 1; }
    .chip[aria-pressed="true"] .chip-box::after { content: '✓'; }

    .status { margin-top: 1rem; color: var(--i360-muted); font-size: 0.9rem; min-height: 1.5rem; }
    .status.error {
      background: var(--i360-banner-bg);
      border: 1px solid var(--i360-banner-border);
      color: var(--i360-banner-text);
      border-radius: 0.375rem;
      padding: 0.6rem 0.9rem;
    }
    .status .retry { margin-inline-start: 0.5rem; font-family: inherit; font-size: 0.85rem; border: 1px solid currentColor; background: transparent; color: inherit; border-radius: 0.25rem; padding: 0 0.5rem; cursor: pointer; }

    .about { margin-top: 2rem; color: var(--i360-text); font-size: 0.85rem; line-height: 1.9; }

    /* ---------- Results ----------
       As in the app: each major opens and closes; rows without an
       intermediate sit directly under it; each intermediate opens and
       closes inside it. */
    .results-bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 0.5rem; margin-top: 1rem; }
    .results-bar .status { margin-top: 0; }
    .bar-btns { display: flex; gap: 0.4rem; }
    .count { font-size: 0.8rem; font-weight: 400; color: var(--i360-muted); font-variant-numeric: tabular-nums; }

    details.major { margin-top: 0.85rem; background: var(--i360-surface); border: 1px solid var(--i360-border); border-radius: 0.5rem; }
    details.inter { margin-top: 0.6rem; border: 1px solid var(--i360-border); border-radius: 0.5rem; }
    details.major > summary, details.inter > summary {
      list-style: none;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.55rem 0.85rem;
      cursor: pointer;
      font-weight: 700;
      color: var(--i360-heading);
      user-select: none;
    }
    details.major > summary { font-size: 1.2rem; }
    details.major > summary:hover, details.inter > summary:hover { background: var(--i360-hover); border-radius: 0.5rem; }
    details > summary::-webkit-details-marker { display: none; }
    details.major > summary::before, details.inter > summary::before { content: '◂'; color: var(--i360-muted); font-size: 0.8rem; transition: transform 0.15s; }
    details.major[open] > summary::before, details.inter[open] > summary::before { transform: rotate(-90deg); }
    details.major > summary:focus-visible, details.inter > summary:focus-visible { outline: none; box-shadow: inset 0 0 0 2px var(--i360-focus); border-radius: 0.5rem; }
    .major-body { padding: 0 0.85rem 0.75rem; }
    .inter-body { padding: 0 0.85rem 0.75rem; }

    .source { padding-top: 0.6rem; }
    .source + .source { border-top: 1px solid var(--i360-rule); margin-top: 0.4rem; }
    .source-name { font-weight: 700; color: var(--i360-heading); font-size: 0.95rem; }
    .source-name .sep { color: var(--i360-muted); font-weight: 400; margin: 0 0.3rem; }
    .source-name .file { font-weight: 700; }

    .hit { display: block; margin-top: 0.35rem; padding: 0.35rem 0.5rem; border-radius: 0.375rem; color: inherit; text-decoration: none; }
    .hit:hover { background: var(--i360-hover); }
    .hit:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--i360-focus); }
    .hit-meta { display: flex; gap: 0.6rem; font-size: 0.8rem; color: var(--i360-link); font-weight: 700; }
    .hit-meta .more-spots { color: var(--i360-muted); font-weight: 400; }
    .hit-text { font-family: 'Amiri', serif; font-size: 1.08rem; line-height: 1.9; }
    .hit-text mark { background: var(--i360-highlight); color: inherit; border-radius: 0.15rem; padding: 0 0.1rem; }

    .group-foot { margin-top: 0.5rem; display: flex; align-items: center; gap: 0.75rem; color: var(--i360-muted); font-size: 0.85rem; }
    .more-btn {
      font-family: inherit;
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--i360-link);
      background: transparent;
      border: 1px solid var(--i360-border);
      border-radius: 0.375rem;
      padding: 0.15rem 0.85rem;
      cursor: pointer;
    }
    .more-btn:hover { background: var(--i360-hover); }
    .more-btn:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--i360-focus); }
    .more-btn.icon-btn { display: inline-flex; align-items: center; padding: 0.2rem 0.45rem; }
    /* Icons: Lucide (lucide.dev, ISC licence), drawn inline; checked by scripts/icons.js. Their
       sizes here; their drawing style for every page: src/page-chrome.css. */
    .icon-btn svg { width: 1.15rem; height: 1.15rem; }
  </style>
</head>
<body>
  <header class="toolbar">
    <!-- The name stays "i360إ" in Arabic text: a left-to-right isolate keeps
         the إ after "i360" (otherwise it shows as "إi360"), and a left-to-right
         mark before the إ keeps it there with Eastern digits ("i٣٦٠إ"). -->
    <!-- In Arabic from the right: theme · numerals … title · ✕ (i360-hub.md §10 "Toolbars"; ✕ only inside the app). -->
    <div class="tb-start">
      <button class="toolbar-btn" id="btn-theme" type="button"></button>
      <button class="toolbar-btn numerals-btn" id="btn-numerals" type="button"></button>
    </div>
    <div class="tb-title">البحث في <bdi dir="ltr">i360&lrm;إ</bdi></div>
    <button class="toolbar-btn" id="btn-close" type="button" aria-label="إغلاق" title="إغلاق" hidden><svg data-lucide="x" viewBox="0 0 24 24"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg></button>
  </header>

  <div class="scroller" id="scroller" tabindex="-1">
  <main>
    <form class="search-form" id="search-form" role="search" autocomplete="off">
      <input class="search-input" id="q" type="search" name="q" enterkeyhint="search" spellcheck="false" aria-label="نص البحث" placeholder="ابحث في نصوص الكتب…">
      <button class="search-btn" type="submit">بحث</button>
    </form>
    <div class="options">
      <button class="chip" id="opt-exact" type="button" aria-pressed="false" title="بدون هذا الخيار يُتجاهل التشكيل وتُعامل أ/إ/آ كـ ا، وة كـ ه، وى كـ ي"><span class="chip-box"></span>مطابقة التشكيل</button>
      <button class="chip" id="opt-word" type="button" aria-pressed="false" title="تجاهل النتائج التي تقع داخل كلمة أطول"><span class="chip-box"></span>كلمة كاملة</button>
    </div>

    <div class="results-bar">
      <div class="status" id="status" role="status" aria-live="polite"></div>
      <div class="bar-btns" id="bar-btns" hidden>
        <button class="more-btn icon-btn" id="btn-expand" type="button" aria-label="توسيع الكل" title="توسيع الكل"><svg data-lucide="list-chevrons-up-down" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 5h8"></path><path d="M3 12h8"></path><path d="M3 19h8"></path><path d="m15 8 3-3 3 3"></path><path d="m15 16 3 3 3-3"></path></svg></button>
        <button class="more-btn icon-btn" id="btn-collapse" type="button" aria-label="طي الكل" title="طي الكل"><svg data-lucide="list-chevrons-down-up" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 5h8"></path><path d="M3 12h8"></path><path d="M3 19h8"></path><path d="m15 5 3 3 3-3"></path><path d="m15 19 3-3 3 3"></path></svg></button>
      </div>
    </div>
    <div id="results"></div>
    <div class="about" id="about"></div>
  </main>
  </div>

  <script>/*@@MAIN@@*/</script>
</body>
</html>
