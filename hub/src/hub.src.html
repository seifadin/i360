<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!--@@CSP@@-->
  <title>الموسوعة الإسلامية &#x2066;i360إ&#x2069;</title>
  <meta name="description" content="أدوات الموسوعة الإسلامية i360إ: التأمل اليومي، وقارئ الكتب، والبحث في الكتب.">

  <!-- Shared i360 theme (theme/ in this repo; https://theme.i36o.workers.dev):
       1. built-in colours, used until theme.css arrives and when it can't;
       2. the saved theme and the saved copy of theme.css, before anything is drawn;
       3. the loader (built in, so the theme button also works offline). -->
  <style id="i360-fallback">/*@@THEME_FALLBACK@@*/</style>
  <script>/*@@THEME_EARLY@@*/</script>
  <script>/*@@THEME_LOADER@@*/</script>
  <link rel="preconnect" href="/*@@THEME_ORIGIN@@*/" crossorigin>

  <style>
    html, body { margin: 0; background: var(--i360-bg); color: var(--i360-text); }
    body {
      font-family: var(--i360-font);   /* Amiri, from the shared theme */
      min-height: 100dvh; box-sizing: border-box;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 1.5rem;
    }
    h1 { font-size: 1.6rem; font-weight: 700; margin: 0 0 1.5rem; text-align: center; color: var(--i360-heading); }
    nav { display: flex; flex-direction: column; gap: 0.75rem; width: 100%; max-width: 22rem; }
    nav a {
      display: block; padding: 0.9rem 1rem; border: 1px solid var(--i360-rule); border-radius: 0.75rem;
      color: var(--i360-text); text-decoration: none; font-size: 1.2rem; font-weight: 700; text-align: center;
    }
    nav a:hover, nav a:focus-visible { background: var(--i360-hover); }
    nav a:focus-visible { outline: 2px solid var(--i360-focus); outline-offset: 2px; }

    /* The numerals and theme buttons: same look and order as in the Reader and the
       CSE (numerals, then theme); top corner on the left in Arabic (the end of the line). */
    .corner {
      position: fixed; top: max(0.5rem, env(safe-area-inset-top)); inset-inline-end: 0.5rem;
      display: flex; gap: 0.25rem;
    }
    .theme-btn {
      background: transparent; border: none; color: var(--i360-icon);
      height: 2rem; min-width: 2rem; padding: 0 0.4rem; border-radius: 0.25rem;
      display: flex; align-items: center; justify-content: center; cursor: pointer;
      transition: background-color 0.15s, color 0.15s;
    }
    .theme-btn:hover { background-color: var(--i360-hover); color: var(--i360-icon-hover); }
    .theme-btn:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--i360-focus); }
    .numerals-btn { font-family: inherit; font-weight: 700; font-size: 0.82rem; min-width: 2.4rem; font-variant-numeric: tabular-nums; }
    /* Icons: Lucide (lucide.dev, ISC licence), drawn inline; checked by scripts/icons.js. */
    .theme-btn svg {
      width: 1.15rem; height: 1.15rem;
      stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; fill: none;
    }
  </style>
</head>
<body>
  <div class="corner">
    <button class="theme-btn numerals-btn" id="btn-numerals" type="button"></button>
    <button class="theme-btn" id="btn-theme" type="button"></button>
  </div>
  <!-- "i360إ" stays in this order in Arabic text: a left-to-right isolate keeps the إ after "i360". -->
  <h1>الموسوعة الإسلامية <bdi dir="ltr" id="name">i360&lrm;إ</bdi></h1>
  <nav aria-label="أدوات الموسوعة">
    <a href="day/">التأمل اليومي</a>
    <a href="md/">قارئ الكتب</a>
    <a href="cse/">البحث في الكتب</a>
  </nav>
  <script>
    // The theme button: shows the shared choice and moves to the next one.
    (function () {
      var ICON = {
        system: '<svg data-lucide="monitor" viewBox="0 0 24 24"><rect width="20" height="14" x="2" y="3" rx="2"></rect><line x1="8" x2="16" y1="21" y2="21"></line><line x1="12" x2="12" y1="17" y2="21"></line></svg>',
        light: '<svg data-lucide="sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2"></path><path d="M12 20v2"></path><path d="m4.93 4.93 1.41 1.41"></path><path d="m17.66 17.66 1.41 1.41"></path><path d="M2 12h2"></path><path d="M20 12h2"></path><path d="m6.34 17.66-1.41 1.41"></path><path d="m19.07 4.93-1.41 1.41"></path></svg>',
        sepia: '<svg data-lucide="coffee" viewBox="0 0 24 24"><path d="M10 2v2"></path><path d="M14 2v2"></path><path d="M16 8a1 1 0 0 1 1 1v8a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4V9a1 1 0 0 1 1-1h14a4 4 0 1 1 0 8h-1"></path><path d="M6 2v2"></path></svg>',
        dark: '<svg data-lucide="moon" viewBox="0 0 24 24"><path d="M20.985 12.486a9 9 0 1 1-9.473-9.472c.405-.022.617.46.402.803a6 6 0 0 0 8.268 8.268c.344-.215.825-.004.803.401"></path></svg>'
      };
      var TITLE = {
        system: 'المظهر: حسب الجهاز (انقر للتبديل إلى فاتح)',
        light: 'المظهر: فاتح (انقر للتبديل إلى ورقي)',
        sepia: 'المظهر: ورقي (انقر للتبديل إلى داكن)',
        dark: 'المظهر: داكن (انقر للتبديل إلى حسب الجهاز)'
      };
      var btn = document.getElementById('btn-theme');
      function show(choice) {
        btn.innerHTML = ICON[choice];
        btn.title = TITLE[choice];
        btn.setAttribute('aria-label', TITLE[choice]);
      }
      i360Theme.onChange(function (s) { show(s.choice); });
      btn.addEventListener('click', function () { i360Theme.cycle(); });
      show(i360Theme.getChoice());

      // The numerals button: the shared choice (0123 · ٠١٢٣ · ۰۱۲۳); here it only
      // changes the digits of the name.
      var nbtn = document.getElementById('btn-numerals'), name = document.getElementById('name');
      var LABEL = { western: '456', arabic: '٤٥٦', persian: '۴۵۶' };   // 4–6 differ between ٠١٢٣ and ۰۱۲۳
      var NTITLE = {
        western: 'الأرقام: غربية 456 (انقر للتبديل إلى العربية المشرقية ٤٥٦)',
        arabic: 'الأرقام: عربية مشرقية ٤٥٦ (انقر للتبديل إلى الفارسية/الأردية ۴۵۶)',
        persian: 'الأرقام: فارسية/أردية ۴۵۶ (انقر للتبديل إلى الغربية 456)'
      };
      function showNumerals(n) {
        nbtn.textContent = LABEL[n];
        nbtn.title = NTITLE[n];
        nbtn.setAttribute('aria-label', NTITLE[n]);
        name.textContent = i360Theme.toNumerals(name.textContent, n);
      }
      i360Theme.onNumeralsChange(function (s) { showNumerals(s.numerals); });
      nbtn.addEventListener('click', function () { i360Theme.cycleNumerals(); });
      showNumerals(i360Theme.getNumerals());
      i360Theme.init();
    })();
  </script>
</body>
</html>
