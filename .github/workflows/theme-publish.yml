# i360 theme: publishes hub/theme/site/ to theme.i36o.workers.dev.
#
# - On a push to vite that changes the theme (hub/theme/**).
# - By hand: Actions → Theme publish → Run workflow.
#
# Uses the same repo secrets as the CSE workflow.
name: Theme publish

on:
  push:
    branches: [vite]
    paths:
      - 'hub/theme/**'
      - '.github/workflows/theme-publish.yml'
  workflow_dispatch:

concurrency:
  group: theme-publish
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    working-directory: hub

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      # Stops here if a plain-colour fallback in theme.css is out of date.
      - run: node theme/fallbacks.js

      - name: Publish to theme.i36o.workers.dev
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.145.0 deploy --config theme/wrangler.jsonc
