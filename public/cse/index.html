  <script>// i360 theme, early part: inlined in each app's <head> (not served), after the
// app's fallback colours and before anything is drawn. It shows the saved
// theme and the saved copy of theme.css at once, so a repeat visit has no
// flash of the wrong colours. theme-loader.js does the rest.
// Plain ES5 on purpose: it must run in any browser that can show the page.
// Keep in step with CHOICE_KEY, CACHE_KEY and THEMES in site/theme-loader.js.
(function () {
  var root = document.documentElement, themes = ['system', 'light', 'sepia', 'dark'];
  var c = root.getAttribute('data-i360-lock');
  if (themes.indexOf(c) < 0) {
    try { c = localStorage.getItem('i360.theme'); } catch (e) { c = null; }
  }
  if (themes.indexOf(c) < 0) c = 'system';
  if (c === 'system') {
    c = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  }
  root.setAttribute('data-theme', c);
  try {
    var k = JSON.parse(localStorage.getItem('i360.theme.css'));
    if (k && typeof k.css === 'string') {
      var s = document.createElement('style');
      s.id = 'i360-theme';
      s.textContent = k.css;
      document.head.appendChild(s);
    }
  } catch (e) { /* no copy yet: the page's own colours */ }
})();
</script>

  <style>
    /* ---------- Colours ----------
       From the shared i360 theme (light = the i360إ app's look; sepia and
       dark = the Reader's); the theme is <html data-theme="…">. The names
       below are the page's own, kept so the rest of this file is unchanged.
       The background is the page colour in every theme. */
    :root {
      --bg-color: var(--i360-bg);
      --toolbar-bg: var(--i360-toolbar);
      --toolbar-border: var(--i360-border);
      --panel-bg: var(--i360-surface);
      --text-color: var(--i360-text);
      --heading: var(--i360-heading);
      --muted: var(--i360-muted);
      --icon-color: var(--i360-icon);
      --icon-hover: var(--i360-icon-hover);
      --hover-bg: var(--i360-hover);
      --active-bg: var(--i360-active);
      --link: var(--i360-link);
      --rule: var(--i360-rule);
      --input-bg: var(--i360-input);
      --focus: var(--i360-focus);
      --btn-bg: var(--i360-accent);
      --btn-text: var(--i360-on-accent);
      --banner-bg: var(--i360-banner-bg);
      --banner-border: var(--i360-banner-border);
      --banner-text: var(--i360-banner-text);
      --highlight-bg: var(--i360-highlight);
    }

    :root { --page-w: 50rem; --gap: clamp(0.75rem, 2vw, 1.5rem); }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    [hidden] { display: none !important; }

    body {
      font-family: var(--i360-font);   /* Amiri, from the shared theme */
      font-size: 1.05rem;
      background-color: var(--bg-color);
      color: var(--text-color);
      line-height: 1.6;
      /* The page scrolls inside .scroller, not the window: browsers keep the
         window's scrollbar on the right even in Arabic, but put a
         right-to-left element's scrollbar on the left. */
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .scroller { flex: 1; min-height: 0; overflow-y: auto; direction: rtl; overscroll-behavior: contain; }
    .scroller:focus { outline: none; }

    /* ---------- Toolbar ---------- */
    /* The toolbar buttons of the hub pages (the Reader, the i360 CSE, Daily Reflection): one size and
   shape on every page (i360-hub.md §10 "Toolbars"). scripts/build.js inlines this file into each
   page's own <style>, before the page's rules, so a page can still adjust a button for itself.
   Colours stay in each page: they differ from page to page in the sepia and dark themes. */
:root {
  --toolbar-h: var(--i360-toolbar-h);   /* the bar: the shared theme's, as the app's */
  --toolbar-btn-h: 2rem;    /* a button in it */
}

.toolbar-btn {
  position: relative;       /* for the tap area below */
  height: var(--toolbar-btn-h);
  min-width: var(--toolbar-btn-h);
  padding: 0 0.4rem;
  border: none;
  border-radius: 0.25rem;
  background: transparent;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 0.4rem;
  flex-shrink: 0;
  cursor: pointer;
  font-size: 0.85rem;
  font-family: inherit;
  transition: background-color 0.15s, color 0.15s;
}
.toolbar-btn:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--i360-focus); }
.toolbar-btn:disabled { opacity: 0.4; cursor: default; }

/* Icons: Lucide (lucide.dev, ISC licence), drawn inline; checked by scripts/icons.js. */
.toolbar-btn svg {
  width: 1.15rem;
  height: 1.15rem;
  stroke: currentColor;
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
  fill: none;
  flex-shrink: 0;
}

/* The numerals button shows digits (٣ / 3), the same width whichever are shown. */
.numerals-btn { font-weight: 700; font-size: 0.82rem; min-width: 2.4rem; font-variant-numeric: tabular-nums; }

.tb-title { font-weight: 700; font-size: 1.05rem; }

/* The tap area, not drawn: each button in the bar reaches from the bar's top edge to its bottom, so
   it stays the bar's full height whatever the two heights above are. Sideways the buttons sit close
   together, so it stays the button's own width. Not in the Reader's ⋮ menu, whose rows are close together. */
:is(.toolbar, .topbar) .toolbar-btn::after {
  content: '';
  position: absolute;
  inset: calc((var(--toolbar-btn-h) - var(--toolbar-h)) / 2) 0;
}
.more-menu .toolbar-btn::after { content: none; }
    .toolbar {
      flex-shrink: 0;
      background-color: var(--toolbar-bg);
      border-bottom: 1px solid var(--toolbar-border);
      min-height: var(--toolbar-h);
      padding-top: env(safe-area-inset-top);
      /* iPhone: clear of the rounded corners and the notch in landscape (viewport-fit=cover) */
      padding-left: calc(0.75rem + env(safe-area-inset-left));
      padding-right: calc(0.75rem + env(safe-area-inset-right));
      display: flex;

    .tb-end { display: flex; align-items: center; gap: 0.25rem; flex-shrink: 0; }

    .toolbar-btn { color: var(--icon-color); }
    .toolbar-btn:hover { background-color: var(--hover-bg); color: var(--icon-hover); }

    /* ---------- Search ---------- */
    main { width: var(--page-w); max-width: 100%; margin: 0 auto; padding: var(--gap) 1rem calc(var(--gap) + env(safe-area-inset-bottom)); }

    .search-form { display: flex; gap: 0.5rem; }
    .search-input {
      flex: 1;
      min-width: 0;
      height: 2.75rem;
      padding: 0 0.85rem;
      border: 1px solid var(--toolbar-border);
      border-radius: 0.5rem;
      background: var(--input-bg);
      color: var(--text-color);
      font-family: inherit;
      font-size: 1.15rem;
      outline: none;
    }
    .search-input:focus { border-color: var(--focus); box-shadow: 0 0 0 3px color-mix(in srgb, var(--focus) 25%, transparent); }
    .search-btn {
      height: 2.75rem;
      padding: 0 1.1rem;
      border: none;
      border-radius: 0.5rem;
      background: var(--btn-bg);
      color: var(--btn-text);
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
    }
    .search-btn:focus-visible { outline: none; box-shadow: 0 0 0 3px color-mix(in srgb, var(--focus) 40%, transparent); }

    .options { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 0.6rem; }
    .chip {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      height: 2rem;
      padding: 0 0.75rem;
      border: 1px solid var(--toolbar-border);
      border-radius: 999px;
      background: var(--panel-bg);
      color: var(--text-color);
      font-family: inherit;
      font-size: 0.85rem;
      cursor: pointer;
    }
    .chip[aria-pressed="true"] { background: var(--active-bg); border-color: var(--focus); color: var(--heading); font-weight: 700; }
    .chip:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--focus); }
    .chip-box { width: 0.9rem; height: 0.9rem; border: 1.5px solid currentColor; border-radius: 0.2rem; display: inline-flex; align-items: center; justify-content: center; font-size: 0.7rem; line-height: 1; }
    .chip[aria-pressed="true"] .chip-box::after { content: '✓'; }

    .status { margin-top: 1rem; color: var(--muted); font-size: 0.9rem; min-height: 1.5rem; }
    .status.error {
      background: var(--banner-bg);
      border: 1px solid var(--banner-border);
      color: var(--banner-text);
      border-radius: 0.375rem;
      padding: 0.6rem 0.9rem;

    .status .retry { margin-inline-start: 0.5rem; font-family: inherit; font-size: 0.85rem; border: 1px solid currentColor; background: transparent; color: inherit; border-radius: 0.25rem; padding: 0 0.5rem; cursor: pointer; }

    .about { margin-top: 2rem; color: var(--text-color); font-size: 0.85rem; line-height: 1.9; }

    /* ---------- Results ----------
       As in the app: each major opens and closes; rows without an
       intermediate sit directly under it; each intermediate opens and
       closes inside it. */
    .results-bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 0.5rem; margin-top: 1rem; }
    .results-bar .status { margin-top: 0; }
    .bar-btns { display: flex; gap: 0.4rem; }
    .count { font-size: 0.8rem; font-weight: 400; color: var(--muted); font-variant-numeric: tabular-nums; }

    details.major { margin-top: 0.85rem; background: var(--panel-bg); border: 1px solid var(--toolbar-border); border-radius: 0.5rem; }
    details.inter { margin-top: 0.6rem; border: 1px solid var(--toolbar-border); border-radius: 0.5rem; }
    details.major > summary, details.inter > summary {
      list-style: none;
      display: flex;
      align-items: center;

    details.major > summary { font-size: 1.2rem; }
    details.major > summary:hover, details.inter > summary:hover { background: var(--hover-bg); border-radius: 0.5rem; }
    details > summary::-webkit-details-marker { display: none; }
    details.major > summary::before, details.inter > summary::before { content: '◂'; color: var(--muted); font-size: 0.8rem; transition: transform 0.15s; }
    details.major[open] > summary::before, details.inter[open] > summary::before { transform: rotate(-90deg); }
    details.major > summary:focus-visible, details.inter > summary:focus-visible { outline: none; box-shadow: inset 0 0 0 2px var(--focus); border-radius: 0.5rem; }
    .major-body { padding: 0 0.85rem 0.75rem; }
    .inter-body { padding: 0 0.85rem 0.75rem; }

    .source { padding-top: 0.6rem; }
    .source + .source { border-top: 1px solid var(--rule); margin-top: 0.4rem; }
    .source-name { font-weight: 700; color: var(--heading); font-size: 0.95rem; }
    .source-name .sep { color: var(--muted); font-weight: 400; margin: 0 0.3rem; }
    .source-name .file { font-weight: 700; }

    .hit { display: block; margin-top: 0.35rem; padding: 0.35rem 0.5rem; border-radius: 0.375rem; color: inherit; text-decoration: none; }

    .more-btn.icon-btn { display: inline-flex; align-items: center; padding: 0.2rem 0.45rem; }
    /* Icons: Lucide (lucide.dev, ISC licence), drawn inline; checked by scripts/icons.js.
