  <script>// i360 theme, early part: inlined in each app's <head> (not served), after the
// app's fallback colours and before anything is drawn. It shows the saved
// theme and the saved copy of theme.css at once, so a repeat visit has no
// flash of the wrong colours. theme-loader.js does the rest.
// Plain ES5 on purpose: it must run in any browser that can show the page.
// Keep in step with CHOICE_KEY, CACHE_KEY and THEMES in site/theme-loader.js.
(function () {
  var root = document.documentElement, themes = ['system', 'light', 'sepia', 'dark'];
  var c = root.getAttribute('data-i360-lock');
  if (themes.indexOf(c) < 0) {
    try { c = localStorage.getItem('i360.theme'); } catch (e) { c = null; }
  }
  if (themes.indexOf(c) < 0) c = 'system';
  if (c === 'system') {
    c = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  }
  root.setAttribute('data-theme', c);
  try {
    var k = JSON.parse(localStorage.getItem('i360.theme.css'));
    if (k && typeof k.css === 'string') {
      var s = document.createElement('style');
      s.id = 'i360-theme';
      s.textContent = k.css;
      document.head.appendChild(s);
    }
  } catch (e) { /* no copy yet: the page's own colours */ }
})();
</script>
  <script>(function () {
'use strict';
// i360 shared theme loader — https://theme.i36o.workers.dev/theme-loader.js
//
// One module for every i360 app. In the page, in this order:
//   1. the app's built-in fallback colours (node theme/fallbacks.js --css),
//   2. theme/early.js inlined (applies the saved theme and the saved copy of
//      theme.css before anything is drawn),
//   3. this loader: either built into the page (the hub's pages: scripts/build.js
//      turns it into a plain script, window.i360Theme, so it also works offline),
//      or imported from the theme site in a module script:
//        import * as theme from 'https://theme.i36o.workers.dev/theme-loader.js';
//        theme.init();
//
// init() applies the saved choice, fetches theme.css fresh (no-cache), and
// keeps a copy on the device for the next visit and for offline use. Without
// the site and without a copy, the app's fallback stays. A page whose <html>
// has data-i360-lock="light" (the i360إ app) always shows that theme.
//
// The choices (theme, and numerals: 0123 · ٠١٢٣ · ۰۱۲۳) are shared by every app
// on the same site (hub: the landing page, Daily Reflection, the Reader, the
// CSE) and follow changes made in another tab.

const THEMES = ['system', 'light', 'sepia', 'dark'];   // the cycle order
const NUMERALS = ['western', 'arabic', 'persian'];      // 0123 · ٠١٢٣ · ۰۱۲۳ (the cycle order)
const NUMERALS_KEY = 'i360.numerals';
const CHOICE_KEY = 'i360.theme';
const CACHE_KEY = 'i360.theme.css';
const CSS_URL = new URL('theme.css', "https://theme.i36o.workers.dev/theme-loader.js").href;
const STYLE_ID = 'i360-theme';
const MAX_CSS = 256 * 1024;

const root = document.documentElement;
const darkQuery = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;
const listeners = new Set();
const numeralListeners = new Set();
let started = false;

function read(key) {
  try { return localStorage.getItem(key); } catch { return null; }
}
function write(key, value) {
  try { localStorage.setItem(key, value); return true; } catch { return false; }   // private browsing, full storage
}

function lockedTheme() {
  const t = root.getAttribute('data-i360-lock');
  return THEMES.includes(t) ? t : null;
}

/** The saved choice: system, light, sepia or dark. */
function getChoice() {
  const lock = lockedTheme();
  if (lock) return lock;
  const c = read(CHOICE_KEY);
  return THEMES.includes(c) ? c : 'system';
}

/** The palette shown now: light, sepia or dark. */
function getTheme(choice = getChoice()) {
  if (choice !== 'system') return choice;
  return darkQuery && darkQuery.matches ? 'dark' : 'light';
}

function apply() {
  const choice = getChoice();
  const theme = getTheme(choice);
  const changed = root.getAttribute('data-theme') !== theme;
  root.setAttribute('data-theme', theme);
  for (const fn of listeners) {
    try { fn({ choice, theme, changed }); } catch (e) { console.error(e); }
  }
  return { choice, theme };
}

/** Save a choice and show it. Ignored when the page is locked. */
function setChoice(choice) {
  if (!THEMES.includes(choice)) throw new Error(`Unknown theme: ${choice}`);
  if (!lockedTheme()) write(CHOICE_KEY, choice);
  return apply();
}

/** Next choice in THEMES order (for a theme button). */
function cycle() {
  const c = getChoice();
  return setChoice(THEMES[(THEMES.indexOf(c) + 1) % THEMES.length]);
}

/** Called with { choice, theme, changed } whenever the theme is applied. Returns a function that stops it. */
function onChange(fn) {
  listeners.add(fn);
  return () => listeners.delete(fn);
}

/* ---------- Numerals: the second shared choice (display only) ---------- */

const DIGIT_ZERO = { western: 0x30, arabic: 0x0660, persian: 0x06F0 };

/** The saved numerals: western (0123), arabic (٠١٢٣) or persian (۰۱۲۳, also Urdu). */
function getNumerals() {
  const n = read(NUMERALS_KEY);
  return NUMERALS.includes(n) ? n : 'western';
}

/** Every digit in text (Western, Arabic-Indic or Persian) written in the given numerals. */
function toNumerals(text, numerals = getNumerals()) {
  const zero = DIGIT_ZERO[numerals] || DIGIT_ZERO.western;
  return String(text).replace(/[0-9\u0660-\u0669\u06F0-\u06F9]/g, (d) => {
    const c = d.charCodeAt(0);
    const v = c >= 0x06F0 ? c - 0x06F0 : c >= 0x0660 ? c - 0x0660 : c - 0x30;
    return String.fromCharCode(zero + v);
  });
}

function applyNumerals() {
  const numerals = getNumerals();
  for (const fn of numeralListeners) {
    try { fn({ numerals }); } catch (e) { console.error(e); }
  }
  return { numerals };
}

/** Save the numerals choice and tell the page. */
function setNumerals(numerals) {
  if (!NUMERALS.includes(numerals)) throw new Error(`Unknown numerals: ${numerals}`);
  write(NUMERALS_KEY, numerals);
  return applyNumerals();
}

/** Next numerals in NUMERALS order (for a numerals button). */
function cycleNumerals() {
  const n = getNumerals();
  return setNumerals(NUMERALS[(NUMERALS.indexOf(n) + 1) % NUMERALS.length]);
}

/** Called with { numerals } whenever the choice changes (here or in another tab). Returns a function that stops it. */
function onNumeralsChange(fn) {
  numeralListeners.add(fn);
  return () => numeralListeners.delete(fn);
}

// Relative font addresses in theme.css point at this site, not at the page.
function absolutize(css) {
  return css.replace(/url\(\s*(['"]?)(?![a-z][a-z0-9+.-]*:|\/|#)([^'")]+)\1\s*\)/gi,
    (m, q, u) => `url(${q}${new URL(u, CSS_URL).href}${q})`);
}

function styleElement() {
  let el = document.getElementById(STYLE_ID);
  if (!el) {
    el = document.createElement('style');
    el.id = STYLE_ID;
    document.head.appendChild(el);   // after the app's fallback, so it wins
  }
  return el;
}

function cached() {
  try {
    const c = JSON.parse(read(CACHE_KEY));
    return c && c.url === CSS_URL && typeof c.css === 'string' ? c.css : null;
  } catch { return null; }
}

/**
 * Start: apply the theme, follow device and other-tab changes, refresh theme.css.
 * Resolves to { choice, theme, source } — source is "network", "cache" or "fallback".
 */
async function init() {
  const state = apply();
  if (!started) {
    started = true;
    if (darkQuery) darkQuery.addEventListener('change', () => { if (getChoice() === 'system') apply(); });
    window.addEventListener('storage', e => {
      if (e.key === CHOICE_KEY) apply();
      if (e.key === NUMERALS_KEY) applyNumerals();
    });
  }

  const copy = cached();
  const existing = document.getElementById(STYLE_ID);
  if (copy && (!existing || existing.textContent !== copy)) styleElement().textContent = copy;
  let source = copy ? 'cache' : 'fallback';

  try {
    const res = await fetch(CSS_URL, { cache: 'no-cache', mode: 'cors', credentials: 'omit' });
    if (!res.ok) throw new Error(`theme.css: HTTP ${res.status}`);
    const text = await res.text();
    if (text.length > MAX_CSS || !text.includes('--i360-bg')) throw new Error('theme.css: unexpected content');
    const css = absolutize(text);
    const el = styleElement();
    if (el.textContent !== css) el.textContent = css;
    if (css !== copy) write(CACHE_KEY, JSON.stringify({ url: CSS_URL, css }));
    source = 'network';
  } catch (e) {
    console.warn('i360 theme: using the', source === 'cache' ? 'saved copy' : "page's own colours", '—', e.message);
  }
  return { ...state, source };
}

window.i360Theme = Object.freeze({ THEMES, NUMERALS, NUMERALS_KEY, CHOICE_KEY, CACHE_KEY, CSS_URL, getChoice, getTheme, setChoice, cycle, onChange, getNumerals, toNumerals, setNumerals, cycleNumerals, onNumeralsChange, init });
})();</script>

  <script>/* i360 search core — shared by the Markdown Reader, the i360 CSE page and

   indexer feeds a book file. Works as a plain <script> (window.SearchCore)
   and as a Node module (require / import).

   أ/إ/آ/ٱ/ٲ/ٳ as ا, ى/ی/ئ as ي, ة as ه, ؤ as و, ک as ك, and Eastern or
   Persian digits as Western. "Exact" compares letters and marks exactly

     page.norm   — normalized text ('\n' between paragraphs)
     page.oNode  — for each norm char: index of its text run (-1 = break)
     page.oOff   — for each norm char: offset inside that run
     page.orig   — original text, runs joined ('\n' between paragraphs)
     page.nodes  — the caller's reference for each run (a DOM node, …)

        if (page.orig) page.orig += '\n';

      // A printed line break (<br>): read as a space.
      lineBreak() {
        if (page.norm && !page.norm.endsWith(' ') && !page.norm.endsWith('\n')) { page.norm += ' '; page.oNode.push(-1); page.oOff.push(-1); }

  // s/e as positions in page.norm, at most opts.max matches.

  <script>/* i360 CSE index — the index format, written by the indexer and read by the
   CSE page, in one file so both sides always agree.

   How a search works:
   1. The query is normalized with SearchCore (the Reader's rules) and cut
      into 3-character pieces (trigrams).
   2. Each trigram's list of pages is read from its shard file; pages that
      have all the trigrams are candidates.
   3. Candidates are confirmed by running SearchCore on the page text
      (diacritics and whole-word options included) — so a result is exactly
      what the Reader would find on that page.

   Published layout (under one build folder, so files never mix builds):
     latest.json                     { buildId }
     b/<buildId>/catalog.json        sources, groups, page ranges
     b/<buildId>/index/<sss>.bin     trigram shards (sss = shard, 3 hex digits)
     b/<buildId>/text/<key>/<n>.json page text, a chunk of pages per file

   A page is a list of paragraphs (strings); "\n" inside a paragraph is a
   printed line break. Matches never cross paragraphs (as in the Reader).
   Works as a plain <script> (window.CseIndex, after SearchCore) and as a
   Node module (require). */
(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory(require('./search-core.js'));
  else root.CseIndex = factory(root.SearchCore);
}(typeof globalThis !== 'undefined' ? globalThis : this, function (SearchCore) {
  'use strict';

  const FORMAT = 1;
  const SHARDS = 1024;
  const MIN_QUERY = 3;           // normalized characters, spaces included
  const MAX_QUERY_TRIGRAMS = 8;  // a long query looks up a spread of its trigrams
  const MAGIC = [0x49, 0x33, 0x54, 0x58];   // "I3TX"

  /* ---------------- Pages ---------------- */

  // Feeds a page to SearchCore exactly as the Reader feeds its rendered page.
  function searchPage(paras, exact) {
    const b = SearchCore.createPage(exact);
    for (const para of paras) {
      b.paragraph();
      para.split('\n').forEach((line, i) => {
        if (i > 0) b.lineBreak();
        if (line) b.text(line, null);
      });
    }
    return b.page;
  }

  // A trigram that cuts a character outside the BMP in half (an emoji, say)
  // can't be stored as text; such trigrams are left out on both sides.
  function splitsSurrogate(t) {
    for (let i = 0; i < t.length; i++) {
      const c = t.charCodeAt(i);
      if (c >= 0xD800 && c <= 0xDFFF) return true;
    }
    return false;
  }

  // Every distinct trigram of a normalized text, never across a paragraph break.
  function trigrams(norm) {
    const out = new Set();
    for (let i = 0; i + 3 <= norm.length; i++) {
      const t = norm.slice(i, i + 3);
      if (!t.includes('\n') && !splitsSurrogate(t)) out.add(t);
    }
    return out;
  }

  // FNV-1a over UTF-16 code units: the shard a trigram lives in.
  function shardOf(tri) {
    let h = 0x811c9dc5;
    for (let i = 0; i < tri.length; i++) { h ^= tri.charCodeAt(i); h = Math.imul(h, 0x01000193); }
    return (h >>> 0) % SHARDS;
  }
  const shardName = (n) => n.toString(16).padStart(3, '0');

  /* ---------------- Query ---------------- */

  // The trigrams to look up for a query (loose normalization: the index is
  // loose; the exact options are applied when candidates are confirmed).
  // [] when the query is shorter than MIN_QUERY.
  function queryTrigrams(raw) {
    const q = SearchCore.normalizeQuery(raw, false);
    if (q.length < MIN_QUERY) return [];
    const all = [];
    for (let i = 0; i + 3 <= q.length; i++) {
      const t = q.slice(i, i + 3);
      if (!splitsSurrogate(t)) all.push(t);
    }
    if (all.length === 0) return [];
    const distinct = [...new Set(all)];
    if (distinct.length <= MAX_QUERY_TRIGRAMS) return distinct;
    // Evenly spread, first and last included: still a superset of the
    // true matches, confirmed afterwards.
    const pick = new Set();
    for (let k = 0; k < MAX_QUERY_TRIGRAMS; k++) pick.add(all[Math.round(k * (all.length - 1) / (MAX_QUERY_TRIGRAMS - 1))]);
    return [...pick];
  }

  function intersect(lists) {
    if (lists.length === 0) return [];
    const sorted = [...lists].sort((a, b) => a.length - b.length);
    let acc = Array.from(sorted[0]);
    for (let k = 1; k < sorted.length && acc.length; k++) {
      const other = sorted[k];
      const out = [];
      let i = 0, j = 0;
      while (i < acc.length && j < other.length) {
        if (acc[i] === other[j]) { out.push(acc[i]); i++; j++; }
        else if (acc[i] < other[j]) i++;
        else j++;

      acc = out;
    }
    return acc;
  }

  /* ---------------- Shard files (binary) ----------------
     "I3TX", u8 format, u32 entry count, then per trigram (sorted):
     u8 byte length + UTF-8 bytes, varint page count, varint byte length,
     then the page ids as varint deltas (ascending). */

  function writeVarint(out, n) {
    while (n >= 0x80) { out.push((n & 0x7f) | 0x80); n = Math.floor(n / 128); }
    out.push(n);
  }

  function encodeShard(map) {   // Map<trigram, number[] ascending>
    const enc = new TextEncoder();
    const out = [...MAGIC, FORMAT, 0, 0, 0, 0];
    const keys = [...map.keys()].sort();
    const n = keys.length;
    out[5] = n & 0xff; out[6] = (n >>> 8) & 0xff; out[7] = (n >>> 16) & 0xff; out[8] = (n >>> 24) & 0xff;
    for (const k of keys) {
      const kb = enc.encode(k);
      out.push(kb.length, ...kb);
      const ids = map.get(k);
      const body = [];
      let prev = 0;
      for (const id of ids) { writeVarint(body, id - prev); prev = id; }
      writeVarint(out, ids.length);
      writeVarint(out, body.length);
      for (const b of body) out.push(b);
    }
    return Uint8Array.from(out);
  }

  // Reads the trigram table; page lists are decoded only when asked for.
  function decodeShard(buf) {
    const u8 = buf instanceof Uint8Array ? buf : new Uint8Array(buf);
    for (let i = 0; i < 4; i++) if (u8[i] !== MAGIC[i]) throw new Error('not an index shard');
    if (u8[4] !== FORMAT) throw new Error(`index format ${u8[4]}, expected ${FORMAT}`);
    const n = u8[5] | (u8[6] << 8) | (u8[7] << 16) | (u8[8] * 2 ** 24);
    const dec = new TextDecoder();
    let p = 9;
    const readVarint = () => {
      let v = 0, mul = 1, b;
      do { b = u8[p++]; v += (b & 0x7f) * mul; mul *= 128; } while (b & 0x80);
      return v;
    };
    const table = new Map();
    for (let e = 0; e < n; e++) {
      const len = u8[p++];
      const key = dec.decode(u8.subarray(p, p + len)); p += len;
      const count = readVarint();
      const bytes = readVarint();
      table.set(key, { count, start: p, end: p + bytes });
      p += bytes;
    }
    return {
      has: (tri) => table.has(tri),
      count: (tri) => (table.get(tri) || { count: 0 }).count,
      pages(tri) {
        const ent = table.get(tri);
        if (!ent) return [];
        const ids = new Array(ent.count);
        let q = ent.start, prev = 0;
        for (let i = 0; i < ent.count; i++) {
          let v = 0, mul = 1, b;
          do { b = u8[q++]; v += (b & 0x7f) * mul; mul *= 128; } while (b & 0x80);
          prev += v;
          ids[i] = prev;
        }
        return ids;
      }
    };
  }

  /* ---------------- Searching a published build ----------------
     load(path) → Promise of an ArrayBuffer (for .bin) or parsed JSON
     (for .json); paths are relative to the build folder. */
  function createSearcher(catalog, load) {
    const shardCache = new Map();
    const chunkCache = new Map();
    const sources = catalog.sources;
    const starts = sources.map((s) => s.firstPage);

    function locate(gp) {   // global page id → { source, local }
      let lo = 0, hi = starts.length - 1, ans = 0;
      while (lo <= hi) {
        const mid = (lo + hi) >> 1;
        if (starts[mid] <= gp) { ans = mid; lo = mid + 1; } else hi = mid - 1;
      }
      return { source: sources[ans], local: gp - starts[ans] };
    }

    function shard(n) {
      if (!shardCache.has(n)) shardCache.set(n, Promise.resolve(load(`index/${shardName(n)}.bin`)).then(decodeShard));
      return shardCache.get(n);
    }

    function chunkOf(source, local) {   // chunk index holding a local page
      let c = 0;
      while (c + 1 < source.chunks.length && source.chunks[c + 1] <= local) c++;
      return c;
    }

    function chunk(source, c) {
      const key = `${source.key}/${c}`;
      if (!chunkCache.has(key)) chunkCache.set(key, Promise.resolve(load(`text/${source.key}/${c}.json`)));
      return chunkCache.get(key);
    }

    // Sorted global page ids that have every looked-up trigram.
    async function candidates(raw) {
      const tris = queryTrigrams(raw);
      if (tris.length === 0) return [];
      const lists = await Promise.all(tris.map(async (t) => (await shard(shardOf(t))).pages(t)));
      return intersect(lists);
    }

    // Confirms candidate pages with SearchCore. Returns, per page that
    // really matches: { gp, source, local, label, vol, count, snippets }.
    async function confirm(gps, raw, opts = {}) {
      const exact = !!opts.exact;
      const q = SearchCore.normalizeQuery(raw, exact);
      const snippetChars = opts.snippetChars || 45;
      const maxSnippets = opts.maxSnippets || 3;
      const out = [];
      for (const gp of gps) {
        const { source, local } = locate(gp);
        const c = chunkOf(source, local);
        const data = await chunk(source, c);
        const pg = data.pages[local - source.chunks[c]];
        const page = searchPage(pg.paras, exact);
        const ms = SearchCore.findMatches([page], q, { word: !!opts.word });
        if (ms.length === 0) continue;
        out.push({
          gp, source, local, label: pg.label, vol: pg.vol == null ? null : pg.vol,
          count: ms.length,
          snippets: ms.slice(0, maxSnippets).map((m) => SearchCore.snippet(m, snippetChars))
        });
      }
      return out;
    }

    return { candidates, confirm, locate };
  }

  /* ---------------- Grouping ----------------
     By ScienceMajor_Ar → ScienceIntermediate_Ar → source, in the app's order
     (IDs compared as numbers, as groupSciences() does). */
  // Groups confirmed pages: [{ major, intermediates: [{ intermediate, sources: [{ source, pages }] }] }].
  // A source listed in several rows appears under each of them.
  function groupResults(hits) {
    const majors = new Map();
    for (const h of hits) {
      const rows = h.source.usedBy && h.source.usedBy.length ? h.source.usedBy : [{}];
      const seen = new Set();
      for (const u of rows) {
        const where = `${u.majorId}|${u.intermediateId}`;
        if (seen.has(where)) continue;   // the same group twice: show once
        seen.add(where);
        const mk = u.majorId || '';
        if (!majors.has(mk)) majors.set(mk, { majorId: u.majorId, major: u.major || '—', inters: new Map() });
        const M = majors.get(mk);
        const ik = u.intermediateId || '';
        if (!M.inters.has(ik)) M.inters.set(ik, { intermediateId: u.intermediateId, intermediate: u.intermediate || '', sources: new Map() });
        const I = M.inters.get(ik);
        if (!I.sources.has(h.source.key)) I.sources.set(h.source.key, { source: h.source, pages: [] });
        I.sources.get(h.source.key).pages.push(h);
      }
    }
    const num = (v) => (v === '' || v == null || Number.isNaN(Number(v)) ? Infinity : Number(v));
    return [...majors.values()].sort((a, b) => num(a.majorId) - num(b.majorId)).map((M) => ({
      major: M.major,
      intermediates: [...M.inters.values()].sort((a, b) => num(a.intermediateId) - num(b.intermediateId)).map((I) => ({
        intermediate: I.intermediate,
        sources: [...I.sources.values()]
      }))
    }));
  }

    function updateMajor(m) {
      const exact = m.groups.every((g) => g.done);
      const n = m.groups.reduce((a, g) => a + (g.done ? g.shown : g.gps.length), 0);
      m.count.textContent = fmt(exact ? fmtNum(n) : `≈ ${fmtNum(n)}`);
      m.count.title = exact ? T.exactTitle : T.approxTitle;
    }

    // Pages in several groups are counted once.
    function updateSummary(ctx) {
      const pages = new Set();
      let exact = true;
      for (const g of ctx.groups) {
        if (!g.done) exact = false;
        for (const gp of g.gps) pages.add(gp);
      }
      if (exact) {
        let n = 0;
        for (const gp of pages) if (ctx.confirmed && ctx.confirmed.has(gp)) n++;
        setStatus(n ? T.summary(fmtNum(n), fmtNum(ctx.groups.filter((g) => g.shown).length), true) : T.noResults);
        if (!n) barEl.hidden = true;
      } else {
        setStatus(T.summary(fmtNum(pages.size), fmtNum(ctx.groups.length), false));
      }
    }

    function confirmPage(ctx, gp) {
      if (!ctx.hits.has(gp)) {
        ctx.hits.set(gp, ctx.searcher.confirm([gp], ctx.q, ctx.opts).then((r) => {
          const hit = r[0] || null;
          if (hit) (ctx.confirmed || (ctx.confirmed = new Set())).add(gp);
          return hit;
        }));
      }
      return ctx.hits.get(gp);
    }

    // Shows the group's next step of results (about RESULTS_PER_STEP pages).
    function loadMore(ctx, g) {
      if (g.loading || g.done) return g.loading;
      g.loading = (async () => {
        g.foot.textContent = T.checking;
        let added = 0;
        try {
          while (added < CseView.RESULTS_PER_STEP && g.next < g.gps.length) {
            const batch = g.gps.slice(g.next, g.next + CONFIRM_BATCH);
            const got = await Promise.all(batch.map((gp) => confirmPage(ctx, gp)));
            if (ctx.run !== state.run) return;
            // Stop at exactly one step; pages checked beyond it are kept for «المزيد».
            for (const hit of got) {
              if (added >= CseView.RESULTS_PER_STEP) break;
              g.next++;
              if (hit) { addHit(ctx, g, hit); added++; }
            }
          }
          g.done = g.next >= g.gps.length;
        } catch (err) {
          if (ctx.run !== state.run) return;
          if (err instanceof BuildGone) { search(input.value); return; }
          showGroupError(ctx, g);
          return;
        } finally {
          g.loading = null;
        }
        setCount(g);
        updateMajor(g.major);
        updateSummary(ctx);
        drawFoot(ctx, g);
        applyNumerals();
      })();
      return g.loading;
    }

    function drawFoot(ctx, g) {
      g.foot.textContent = '';
      if (g.done && g.shown === 0) { g.foot.textContent = T.noMatches; return; }
      if (g.done) return;
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'more-btn'; b.textContent = T.more;
      b.addEventListener('click', () => loadMore(ctx, g));
      g.foot.append(b);
    }

    function showGroupError(ctx, g) {
      g.foot.textContent = '';
      g.foot.append(T.searchError);
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'more-btn'; b.textContent = T.retry;
      b.addEventListener('click', () => loadMore(ctx, g));
      g.foot.append(b);
    }

    function sourceBlock(ctx, g, source) {
      if (g.sources.has(source.key)) return g.sources.get(source.key);
      const block = document.createElement('div');
      block.className = 'source';
      const head = document.createElement('div');
      head.className = 'source-name';
      const nm = CseView.sourceName(source, state.counts);
      const title = document.createElement('span');
      title.textContent = `«${nm.title}»`;
      head.append(title);
      if (nm.file) {
        const sep = document.createElement('span');
        sep.className = 'sep'; sep.textContent = '\\';
        const file = document.createElement('span');
        file.className = 'file'; file.textContent = `«${nm.file}»`;
        head.append(sep, file);
      }
      block.append(head);
      g.list.append(block);
      g.sources.set(source.key, block);
      return block;
    }

    // The phone's browser overlay (Custom Tabs / Safari sheet) through the app's Browser plugin,
    // called over Capacitor's bridge (this page doesn't bundle the plugin's JavaScript). If
    // that fails, an ordinary navigation: Capacitor hands an outside address to the phone's
    // browser app.
    function openOutside(e) {
      e.preventDefault();
      const url = e.currentTarget.href;
      Promise.resolve()
        .then(() => window.Capacitor.nativePromise('Browser', 'open', { url }))
        .catch(() => { window.location.href = url; });
    }

    function addHit(ctx, g, hit) {
      g.shown++;
      const block = sourceBlock(ctx, g, hit.source);
      const sn = hit.snippets[0];
      const a = document.createElement('a');
      a.className = 'hit';
      const link = CseView.resultLink(hit, ctx.q, sn ? sn.hit : '');
      const toReader = link.startsWith(CseView.READER);
      a.href = link;
      if (IN_APP) {
        // Inside the app: the Reader in this same view (its ✕ and the back button return
        // here); anything else in the phone's browser overlay, like every resource in the app.
        if (!toReader) a.addEventListener('click', openOutside);
      } else {
        a.target = '_blank';
        a.rel = 'noopener noreferrer';
      }
      a.title = toReader ? T.openReader : T.openTitle;
      const label = CseView.pageLabel(hit);
      if (label || hit.count > 1) {
        const meta = document.createElement('div');
        meta.className = 'hit-meta';
        if (label) { const l = document.createElement('span'); l.textContent = label; meta.append(l); }
        if (hit.count > 1) { const c = document.createElement('span'); c.className = 'more-spots'; c.textContent = T.spots(hit.count); meta.append(c); }
        a.append(meta);
      }
      if (sn) {
        const t = document.createElement('div');
        t.className = 'hit-text';
        const mark = document.createElement('mark');
        mark.textContent = sn.hit;
        t.append(sn.before, mark, sn.after);
        a.append(t);
      }
      block.append(a);
    }

    /* ---------------- Events ---------------- */
    form.addEventListener('submit', (e) => {
      e.preventDefault();
      input.blur();
      search(input.value, { push: true });
    });
    btnExact.addEventListener('click', () => {
      state.exact = !state.exact; setOption(btnExact, state.exact);
      if (input.value.trim()) search(input.value);
    });
    btnWord.addEventListener('click', () => {
      state.word = !state.word; setOption(btnWord, state.word);
      if (input.value.trim()) search(input.value);
    });
    // Numerals: the shared i360 choice, also followed when another app or tab changes it.
    btnNumerals.addEventListener('click', () => { i360Theme.cycleNumerals(); });
    i360Theme.onNumeralsChange(({ numerals }) => {
      if (numerals === state.numerals) return;
      state.numerals = numerals;
      applyNumerals();
    });
    btnTheme.addEventListener('click', () => {
      i360Theme.cycle();
    });
    // Opening a group loads its first step of results, as a tap does.
    $('btn-expand').addEventListener('click', () => {
      for (const d of resultsEl.querySelectorAll('details')) d.open = true;
    });
    $('btn-collapse').addEventListener('click', () => {
      for (const d of resultsEl.querySelectorAll('details')) d.open = false;
    });
    window.addEventListener('popstate', () => fromAddress());

    function fromAddress() {
      const a = CseView.readAddress(window.location.search, window.location.hostname, window.location.protocol);
      state.exact = a.exact; state.word = a.word;
      setOption(btnExact, a.exact); setOption(btnWord, a.word);
      input.value = a.q;
      search(a.q);
    }

    /* ---------------- Start ---------------- */
    // Keys scroll the results, as they would scroll a normal page.
    document.addEventListener('keydown', (e) => {
      const t = e.target;
      if (t === document.body && ['PageDown', 'PageUp', 'Home', 'End', 'ArrowDown', 'ArrowUp', ' '].includes(e.key)) $('scroller').focus({ preventScroll: true });
    });

    function init() {
      // In the app, ✕ returns to its home: back to it when opened from it (the history stays
      // home → this page's searches, which the back button and the iOS swipe follow), else
      // home in place of this page. As in Daily Reflection and the Reader.
      if (IN_APP) {
        const x = $('btn-close');
        x.hidden = false;
        x.addEventListener('click', () => {
          let fromApp = false;
          try { fromApp = history.length > 1 && !!document.referrer && new URL(document.referrer).origin === location.origin; } catch { /* no referrer */ }
          // Back past this page's own searches, to the page it was opened from.
          if (fromApp) history.go(-(stepsIn() + 1)); else window.location.replace('/index.html');
        });
      }
      state.theme = i360Theme.getChoice();
      i360Theme.init();   // fresh theme.css in the background; the saved copy is already shown
      state.numerals = i360Theme.getNumerals();
      applyTheme();
      applyNumerals();
      const a = CseView.readAddress(window.location.search, window.location.hostname, window.location.protocol);
      if (a.data) state.dataBase = a.data;
      fromAddress();
      if (!a.q) {
        input.focus();
        // The index details under the search box.
        loadCatalog().then(applyNumerals).catch(() => { /* shown when a search is made */ });
      }
    }
    init();
  })();
  </script>
</body>
</html>
